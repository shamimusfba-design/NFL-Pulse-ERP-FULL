   Any <select> inside a .filters bar becomes an empty search box: typing suggests the matching values,
   values that START with the typed text first ("b" → buyers starting with b, "bl" → Black …). Empty box = all. */
(function(){
  const rank=(t,q)=>{t=t.toLowerCase();if(!q)return 2;if(t.startsWith(q))return 0;if(t.split(/[\s\-/(]+/).some(w=>w.startsWith(q)))return 1;return t.includes(q)?2:9};
  function enhance(sel){
    if(sel.dataset.combo||sel.disabled||sel.options.length<2)return;sel.dataset.combo='1';
    const all=sel.options[0].value===''?sel.options[0].text:'All';
    const wrap=document.createElement('span');wrap.className='cbx';
    const inp=document.createElement('input');inp.type='search';inp.placeholder=all;inp.autocomplete='off';inp.setAttribute('aria-label',all);
    const cur=sel.options[sel.selectedIndex];if(cur&&cur.value!=='')inp.value=cur.text;
    if(sel.title)inp.title=sel.title;
    const list=document.createElement('div');list.className='cbl';
    sel.style.display='none';sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(inp);wrap.appendChild(list);wrap.appendChild(sel);
    let hi=0,items=[];
    const pick=o=>{sel.value=o?o.value:'';inp.value=o&&o.value!==''?o.text:'';list.classList.remove('on');sel.dispatchEvent(new Event('change',{bubbles:true}))};
    const draw=()=>{const q=inp.value.trim().toLowerCase();
      items=[...sel.options].filter(o=>o.value!=='').map(o=>({o,r:rank(o.text,q)})).filter(x=>x.r<9).sort((a,b)=>a.r-b.r).slice(0,200).map(x=>x.o);
      hi=0;list.innerHTML=(q?'':`<div class="cbo all" data-k="-1">${all}</div>`)+items.map((o,k)=>`<div class="cbo" data-k="${k}">${o.text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`).join('')+(items.length?'':'<div class="cbo none">No match</div>');
      list.classList.add('on');mark()};
    const mark=()=>list.querySelectorAll('.cbo[data-k]').forEach(e=>e.classList.toggle('hi',+e.dataset.k===hi));
    inp.addEventListener('focus',()=>{inp.select();draw()});inp.addEventListener('input',draw);
    inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){hi=Math.min(items.length-1,hi+1);mark();e.preventDefault()}else if(e.key==='ArrowUp'){hi=Math.max(0,hi-1);mark();e.preventDefault()}
      else if(e.key==='Enter'){e.preventDefault();inp.value.trim()?pick(items[hi]):pick(null)}else if(e.key==='Escape'){list.classList.remove('on');inp.blur()}});
    list.addEventListener('mousedown',e=>{const d=e.target.closest('.cbo[data-k]');if(!d)return;e.preventDefault();const k=+d.dataset.k;pick(k<0?null:items[k])});
    inp.addEventListener('blur',()=>setTimeout(()=>{list.classList.remove('on');const c=sel.options[sel.selectedIndex];if(!inp.value.trim()&&sel.value!=='')pick(null);else inp.value=c&&c.value!==''?c.text:''},120));
  }
  const run=()=>document.querySelectorAll('.filters select').forEach(enhance);
  new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',run);run();
})();

/* ---------- fabric matching (reuse suggestions) ----------
   Must match: fabric type / construction, GSM within ±5%, width close enough, composition when both sides have it,
   colour for finished fabric (and for greige that is yarn-dyed / melange), no AOP / print unless the same job.
   Shade always needs a physical / lab check: a different dye lot never matches 100%. */
const normType=s=>String(s||'').toLowerCase().replace(/fabric|finish/g,'').replace(/lycra/g,'l').replace(/[\s.\-_/()]/g,'').replace(/singlejersey/g,'sj');
const numOf=s=>{const m=String(s||'').match(/\d+(\.\d+)?/);return m?+m[0]:null};
const normColour=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[-–]\s*(aop|ad|adv).*/,'').replace(/\b(c-?n?\d+|\d{2}-\d{4}\s*tcx|tcx|tpx)\b/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const normComp=s=>String(s||'').toLowerCase().replace(/\s+/g,'').replace(/organic|org|dtf/g,'');
const isPrint=s=>/aop|print|discharge/i.test(String(s||''));
const isYarnColour=(ft,c)=>/y\/?d|stripe|melange|mel\b|avg|cvc|grindle/i.test(String(ft||'')+' '+String(c||''));
function matchScore(need,have,opt){ // need/have: {ft,gsm,dia,comp,c,ap}; returns {ok,score,why[],warn[]}
  const why=[],warn=[];let score=0;
  if(!need.ft||normType(need.ft)!==normType(have.ft))return{ok:false};
  why.push('Fabric '+have.ft);score+=30;
  const g1=numOf(need.gsm),g2=numOf(have.gsm);
  if(g1&&g2){const d=Math.abs(g1-g2)/g1;if(d>0.05)return{ok:false};score+=d<=0.02?25:15;why.push(`GSM ${g2} vs ${g1}`)}else warn.push('GSM not recorded');
  const d1=numOf(need.dia),d2=numOf(have.dia);
  if(d1&&d2){const diff=d2-d1;if(opt.finished){if(diff<-1||diff>6)return{ok:false};score+=diff<=2?15:8;why.push(`Dia ${d2}" for ${d1}"`)}else{if(Math.abs(diff)>2)return{ok:false};score+=Math.abs(diff)<=1?15:8;why.push(`Dia ${d2}" vs ${d1}"`)}}else warn.push('Dia not recorded');
  if(need.comp&&have.comp){if(normComp(need.comp)!==normComp(have.comp))return{ok:false};score+=15;why.push('Same composition')}else warn.push('Check composition / yarn');
  if(opt.finished||isYarnColour(need.ft,need.c)||isYarnColour(have.ft,have.c)){
    const c1=normColour(need.c),c2=normColour(have.c);if(!c1||c1!==c2)return{ok:false};score+=15;why.push('Colour '+have.c);

  }
  if(isPrint(need.c)||isPrint(need.ap)||isPrint(have.c)||isPrint(have.ap))return{ok:false};

}

/* ---------- fabric attributes from the factory's fabric names ---------- */

  if(/seersucker/.test(t))return'Seersucker';if(/jacquard/.test(t))return'Jacquard';if(/mesh/.test(t))return'Mesh';if(/needle ?drop/.test(t))return'Needle drop';
  if(/s\s*\/\s*j|single\s*jersey|\bsj\b|jersey|\/j\b|\bh\/?l\/?j\b|heavy\s*\/?\s*j/.test(t))return'Single Jersey';if(/twill|woven|chiffon/.test(t))return'Woven';return t?'Other':'—'}
function fabConstruction(s){const t=String(s||'').toLowerCase();const m=t.match(/(\d)\s*x\s*(\d)/);
  if(m)return`${m[1]}x${m[2]} Rib`;if(/rib/.test(t))return'Rib (not stated)';if(/slub/.test(t))return'Slub';if(/y\.?\s*\/?\s*d|stripe/.test(t))return'Yarn-dyed / stripe';if(/needle ?drop/.test(t))return'Needle drop';
  if(/brush|fleece/.test(t))return'Brushed back';if(/f\.?\s*terry|french terry|loop/.test(t))return'Loop back (French terry)';if(/pique/.test(t))return'Pique';if(/waffle/.test(t))return'Waffle';if(/jacquard/.test(t))return'Jacquard';return'Plain'}

  const t=String(text||'').toLowerCase();const elast=/^l[\/\s-]|lycra|\blyc\b|spandex|elastane/.test(t);

/* ---------- finished store derived values ---------- */
function fAccepted(r){return S.ddel.filter(d=>d.i===r.i&&d.st==='Accepted')}
const tri=o=>(o.body||0)+(o.lrib||0)+(o.sj||0);
function fRecv(r){return r.vb+r.vl+r.vs+fAccepted(r).reduce((a,d)=>a+tri(d.acc),0)}
function fIssued(r){return S.cut.filter(x=>x.i===r.i).reduce((a,x)=>a+tri(x),0)}
function fReturned(r){return S.ret.filter(x=>x.i===r.i).reduce((a,x)=>a+x.kg,0)}
function fSentReuse(r){return S.fre[r.i]?S.fre[r.i].kg:0}
function fStock(r){return fRecv(r)-fIssued(r)+fReturned(r)-fSentReuse(r)}
function fBal(r){return Math.max(0,r.rt-fRecv(r))}

 {g:'Requirement',h:'Body',n:1,v:r=>kg(r.rb)},{g:'Requirement',h:'L Rib',n:1,v:r=>kg(r.rl)},{g:'Requirement',h:'S.Jersey',n:1,v:r=>kg(r.rs)},{g:'Requirement',h:'Total',n:1,v:r=>`<b>${kg(r.rt)}</b>`},
 {g:'Received',h:'Body',n:1,v:r=>kg(r.vb+fAccepted(r).reduce((a,d)=>a+(d.acc.body||0),0))},{g:'Received',h:'L Rib',n:1,v:r=>kg(r.vl+fAccepted(r).reduce((a,d)=>a+(d.acc.lrib||0),0))},{g:'Received',h:'S.Jersey',n:1,v:r=>kg(r.vs+fAccepted(r).reduce((a,d)=>a+(d.acc.sj||0),0))},{g:'Received',h:'Total',n:1,v:r=>`<b>${kg(fRecv(r))}</b>`},
 {g:'Received',h:'Challan',v:r=>esc([r.ch,...fAccepted(r).map(d=>d.ch)].filter(Boolean).join(' / '))},{g:'Received',h:'Balance from dyeing',n:1,v:r=>{const b=fBal(r);return b>0.5?`<span class="neg">${kgs(b)}</span>`:''}},
 {g:'Issued',h:'To cutting',n:1,v:r=>kg(fIssued(r))},{g:'Issued',h:'Returned',n:1,v:r=>kg(fReturned(r))},{g:'Issued',h:'Cutting OK',v:r=>S.cutok[r.b+'|'+r.j]?pill('OK','good'):''},{g:'Issued',h:'Cutting lots',v:r=>esc(S.cut.filter(x=>x.i===r.i).map(x=>x.lot).join(', '))},
 {g:'Stock',h:'Stock',n:1,v:r=>`<b>${kgs(fStock(r))}</b>`},{g:'Stock',h:'Location',v:r=>esc(uniq(fAccepted(r).map(d=>d.acc.loc+(d.acc.rack?' '+d.acc.rack:''))).join(', '))},{g:'Stock',h:'Status',v:r=>pill(fStatus(r),FSTC[fStatus(r)])},
 {g:'Tracking',h:'Dyeing',v:r=>esc(r.df)},{g:'Tracking',h:'T&A dlv',v:r=>fd(r.tpe)},{g:'Tracking',h:'Last dlv',v:r=>fd([r.ae,...fAccepted(r).map(d=>d.acc.d)].filter(Boolean).sort().pop()||'')},{g:'Tracking',h:'Slot',v:r=>esc(r.sl)},{g:'Tracking',h:'Month',v:r=>mlabel(r.m)},{g:'Tracking',h:'Merchandiser',v:r=>esc(r.mr)}];
const FGROUPS=[...new Set(FCOLS.map(c=>c.g))];
function fFiltered(){const q=FF.q.toLowerCase();return F.filter(r=>(!FF.b||r.b===FF.b)&&(!FF.m||r.m===FF.m)&&(!FF.sl||r.sl===FF.sl)&&(!FF.st||fStatus(r)===FF.st)&&(!FF.type||r.type===FF.type)&&(!FF.cons||r.cons===FF.cons)&&(!FF.comp||r.comp===FF.comp)&&(!FF.col||r.col===FF.col)&&(!q||(r.j+' '+r.c+' '+(r.st||'')+' '+(r.ch||'')).toLowerCase().includes(q)))}

  }
  const L=fFiltered();
  const rec=jobsKg(L.filter(r=>fRecv(r)>0),fRecv),stock=jobsKg(L.filter(r=>fStock(r)>0.5),fStock),bal=jobsKg(L.filter(r=>fBal(r)>0.5),fBal);
  const pend=S.ddel.filter(d=>d.st==='Pending'),diff=S.ddel.filter(d=>d.acc&&Math.abs(tri(d.acc)-tri(d))>0.5);
  const cutT=S.cut.filter(x=>x.d===TODAY).reduce((a,x)=>a+tri(x),0),recT=S.ddel.filter(d=>d.acc&&d.acc.d===TODAY).reduce((a,d)=>a+tri(d.acc),0);

   +card2('Waiting to receive',pend.length+'<span class="k"> challans</span>',kgs(pend.reduce((a,d)=>a+tri(d),0))+' kg from dyeing','bad','go-fr')

   +card2('Weight difference',diff.length+'<span class="k"> challans</span>',kgs(diff.reduce((a,d)=>a+tri(d.acc)-tri(d),0))+' kg weighed − challan','warn','go-fr');
  $('#fs-cards').querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>show(el.dataset.act.slice(3)));
  const by={};L.forEach(r=>{by[r.b]=by[r.b]||[0,0];by[r.b][0]+=Math.min(fRecv(r),r.rt);by[r.b][1]+=fBal(r)});
  const bi=Object.entries(by).sort((a,b)=>b[1][0]+b[1][1]-a[1][0]-a[1][1]).slice(0,9).map(([t,v])=>({t,v,lab:kgs(v[1])+' bal'}));
  const mo={};L.forEach(r=>{mo[r.m]=mo[r.m]||[0,0];mo[r.m][0]+=r.rt;mo[r.m][1]+=Math.min(fRecv(r),r.rt)});
  const mi=Object.keys(mo).sort().map(m=>({x:mlabel(m),v:mo[m],tip:`${mlabel(m)}: required ${kgs(mo[m][0])} · received ${kgs(mo[m][1])} kg`}));
  const part={Body:0,'L Rib':0,'S.Jersey':0};L.forEach(r=>{part.Body+=r.vb;part['L Rib']+=r.vl;part['S.Jersey']+=r.vs});S.ddel.filter(d=>d.acc).forEach(d=>{part.Body+=d.acc.body||0;part['L Rib']+=d.acc.lrib||0;part['S.Jersey']+=d.acc.sj||0});
  $('#fs-charts').innerHTML=`<div class="chart"><h4>Buyer-wise received vs still to come (kg)</h4>${legend([['Received',C4],['Balance',C3]])}${hbars(bi,[C4,C3])}</div><div class="chart"><h4>Month-wise required vs received (kg)</h4>${legend([['Required',C1],['Received',C2]])}${colbars(mi,[C1,C2])}</div><div class="chart"><h4>Received by part (kg)</h4>${hbars(Object.entries(part).map(([t,v])=>({t,v:[v],lab:kgs(v)+' kg'})),[C1])}</div>`;
  $('#fs-groups').innerHTML='<span class="lbl">Show columns:</span>'+FGROUPS.map(g=>`<button class="chipb ${FF.groups.has(g)?'on':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  $('#fs-groups').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g;FF.groups.has(g)?FF.groups.delete(g):FF.groups.add(g);renderFS(false)});
  table('#fs-tw','#fs-pager',L,FCOLS.filter(c=>FF.groups.has(c.g)),FF,()=>renderFS(false),r=>openFLine(r.i));

    $('#cok-go').onclick=()=>{if(role()!=='Cutting')return toast('Cutting confirms cutting OK');const k=r.b+'|'+r.j;if(S.cutok[k])delete S.cutok[k];else S.cutok[k]={d:TODAY,by:role()};save();toast(S.cutok[k]?'Job marked cutting OK':'Cutting OK removed');refreshAll()};}
  const go=$('#ci-go');if(go)go.onclick=()=>{if(role()!=='Finished Fabric Store')return toast('Finished Fabric Store issues fabric');const o={body:+$('#ci-b').value||0,lrib:+$('#ci-l').value||0,sj:+$('#ci-s').value||0},lot=$('#ci-lot').value.trim();if(!lot)return toast('Enter the cutting lot no');if(!(tri(o)>0))return toast('Enter the qty');if(tri(o)>fStock(r)+0.5)return toast(`Only ${kgs(fStock(r))} kg in stock`);
    S.cseq++;S.cut.push({no:'FI-'+String(S.cseq).padStart(4,'0'),i:r.i,lot,...o,d:TODAY,by:role()});save();toast(`Issued ${kgs(tri(o))} kg to cutting lot ${lot}`);FC.sel=null;refreshAll()};
  const cs=S.cut.slice().reverse();
  $('#fc-table').innerHTML=cs.length?`<table><thead><tr><th>Issue no</th><th>Date</th><th>Job · colour</th><th>Cutting lot</th><th class="n">Body</th><th class="n">L Rib</th><th class="n">S.J</th><th class="n">Total</th></tr></thead><tbody>${cs.map(x=>{const r=F[x.i];return `<tr><td>${esc(x.no)}</td><td>${fd(x.d)}</td><td>${esc(r.b+' '+r.j+' · '+r.c)}</td><td>${esc(x.lot)}</td><td class="n">${kg(x.body)}</td><td class="n">${kg(x.lrib)}</td><td class="n">${kg(x.sj)}</td><td class="n"><b>${kgs(tri(x))}</b></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No issues to cutting yet</div>';
}


/* ================= REUSE FABRIC (finished) =================
   Leftover finished fabric (cutting OK + shipment date passed) is sent to the reuse list.
   The Jan'26 Fabric Store Inventory closing stock (old jobs, shipment long passed) starts the list.
   When a merchandiser creates a fabric order sheet, matching reuse fabric (fabric, composition, GSM, dia, colour) is suggested;
   Planning can hold the approval until the fabric is checked physically. */
const FU={tab:'list',type:'',cons:'',comp:'',col:'',fam:'',gsm:'',b:'',q:'',ship:''};
const colourFamily=c=>{const n=normColour(c);if(/\bblack\b|jet/.test(n))return'Black';if(/\bwhite\b|optic|snow|bright white/.test(n))return'White';if(/navy/.test(n))return'Navy';if(/grey|gray|melange/.test(n))return'Grey / melange';if(/ecru|cream|natural|ivory/.test(n))return'Ecru / natural';return'Other colours'};
function freserved(rid){return S.resv.filter(x=>x.rid===rid).reduce((a,x)=>a+x.kg,0)}
function fReuseItems(){
  const out=R.map((x,k)=>({rid:'R'+k,src:'Inventory Jan-26',b:x.b,j:x.j,st:x.st,ft:x.f,comp:x.comp,ap:x.ap,gsm:x.gsm,dia:x.dia,c:x.c,kg:(x.body||0)+(x.rib||0),body:x.body||0,rib:x.rib||0,loc:[x.loc,x.rack].filter(Boolean).join(' '),d:x.d}));
  F.forEach(r=>{const u=S.fre[r.i];if(u)out.push({rid:'F'+r.i,src:'Sent after cutting',b:r.b,j:r.j,st:r.st,ft:r.f,comp:'',ap:r.ap,gsm:r.gsm,dia:r.dia,c:r.c,kg:u.kg,loc:u.loc,d:u.d})});
  out.forEach((x,k)=>{x.avail=Math.max(0,x.kg-freserved(x.rid));x.fam=colourFamily(x.c);x.i=k;x.jc=x.j;x.type=fabType(x.ft);x.cons=fabConstruction(x.ft);x.compL=fabComposition(x.ft,x.comp);x.col=colourName(x.c)});return out;
}
function readyToSend(){return F.filter(r=>!S.fre[r.i]&&S.cutok[r.b+'|'+r.j]&&fStock(r)>=2)}
function renderFU(){
  const items=fReuseItems(),rts=readyToSend();
  const tot=items.reduce((a,x)=>a+x.avail,0);const fam={};items.forEach(x=>{fam[x.fam]=(fam[x.fam]||0)+x.avail});
  $('#fu-cards').innerHTML=card2('Reuse fabric available',kgs(tot)+'<span class="k"> kg</span>',items.length+' lines · '+uniq(items.map(x=>normColour(x.c))).length+' colours','good')
   +card2('Black',kgs(fam.Black||0)+'<span class="k"> kg</span>','most reusable','')+card2('White',kgs(fam.White||0)+'<span class="k"> kg</span>','most reusable','')
   +card2('Ready to send to reuse',rts.length+'<span class="k"> lines</span>',kgs(rts.reduce((a,r)=>a+fStock(r),0))+' kg · cutting OK','warn','tab:send')
   +card2('Reserved for new jobs',kgs(S.resv.reduce((a,x)=>a+x.kg,0))+'<span class="k"> kg</span>',S.resv.length+' reservations')
   +card2('Order sheet checks on hold',S.flags.filter(f=>f.st==='Hold for physical check').length+'<span class="k"> jobs</span>','Planning holds approval until checked','warn','tab:flags');
  $('#fu-cards').querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>{FU.tab=el.dataset.act.slice(4);renderFU()});
  const bt={};items.forEach(x=>{bt[x.ft||'—']=(bt[x.ft||'—']||0)+x.avail});
  const top={};items.forEach(x=>{const k=x.c||'—';top[k]=(top[k]||0)+x.avail});
  $('#fu-charts').innerHTML=`<div class="chart"><h4>Reuse fabric by type (kg)</h4>${hbars(Object.entries(bt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t,v])=>({t,v:[v],lab:kgs(v)+' kg'})),[C4])}</div>
   <div class="chart"><h4>By colour family (kg)</h4>${hbars(Object.entries(fam).sort((a,b)=>b[1]-a[1]).map(([t,v])=>({t,v:[v],lab:kgs(v)+' kg'})),[C1])}</div>
   <div class="chart"><h4>Top colours (kg)</h4>${hbars(Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t,v])=>({t,v:[v],lab:kgs(v)+' kg'})),[C2])}</div>`;
  const tabs=[['list','Reuse list ('+items.length+')'],['send','Ready to send ('+rts.length+')'],['find','Find a match'],['flags','Order sheet checks ('+S.flags.length+')']];
  $('#fu-tabs').innerHTML=tabs.map(([k,l])=>`<button class="${FU.tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#fu-tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{FU.tab=b.dataset.t;renderFU()});
  ({list:fuList,send:fuSend,find:fuFind,flags:fuFlags})[FU.tab](items,rts);
}
const FUC=[{g:'Colour',h:'Colour family',v:x=>esc(x.fam)},{g:'Colour',h:'Colour',v:x=>esc(x.col)},{g:'Fabric',h:'Type',v:x=>esc(x.type)},{g:'Fabric',h:'Construction',v:x=>esc(x.cons)},{g:'Fabric',h:'Composition',v:x=>esc(x.compL)},{g:'Fabric',h:'Fabric',v:x=>esc(x.ft)},{g:'Fabric',h:'GSM',v:x=>esc(x.gsm)},{g:'Fabric',h:'Dia',v:x=>esc(x.dia)},{g:'Fabric',h:'Process',v:x=>esc(x.ap)},
 {g:'Stock',h:'Available kg',n:1,v:x=>`<b>${kgs(x.avail)}</b>`,f:x=>String(Math.round(x.avail))},{g:'Stock',h:'Reserved',n:1,v:x=>kg(freserved(x.rid))},{g:'Stock',h:'Location',v:x=>esc(x.loc)},{g:'Stock',h:'Source',v:x=>pill(x.src,x.src==='Inventory Jan-26'?'':'info'),f:x=>x.src}];
FU.page=0;FU.cf={};
function fuList(items){
  const q=FU.q.toLowerCase();
  const L=items.filter(x=>(!FU.type||x.type===FU.type)&&(!FU.cons||x.cons===FU.cons)&&(!FU.comp||x.compL===FU.comp)&&(!FU.col||x.col===FU.col)&&(!FU.fam||x.fam===FU.fam)&&(!FU.gsm||String(x.gsm)===FU.gsm)&&(!FU.b||x.b===FU.b)&&(!q||(x.j+' '+x.c+' '+(x.comp||'')+' '+x.ft).toLowerCase().includes(q))).sort((a,b)=>a.fam.localeCompare(b.fam)||a.col.localeCompare(b.col)||(a.type||'').localeCompare(b.type||''));
  $('#fu-body').innerHTML=`<div class="filters"><select id="fu-type">${optList(uniq(items.map(x=>x.type)),FU.type,'All fabric types')}</select><select id="fu-cons">${optList(uniq(items.map(x=>x.cons)),FU.cons,'All constructions')}</select><select id="fu-comp">${optList(uniq(items.map(x=>x.compL)),FU.comp,'All compositions')}</select><select id="fu-col">${optList(uniq(items.map(x=>x.col)),FU.col,'All colours ('+uniq(items.map(x=>x.col)).length+')')}</select><select id="fu-fam">${optList(['Black','White','Navy','Grey / melange','Ecru / natural','Other colours'],FU.fam,'All colour families')}</select><select id="fu-gsm">${optList(uniq(items.map(x=>String(x.gsm||''))),FU.gsm,'All GSM')}</select><select id="fu-b">${optList(uniq(items.map(x=>x.b)),FU.b,'All buyers')}</select><input id="fu-q" placeholder="Colour, job, composition" value="${esc(FU.q)}"><span class="muted">${L.length} lines · ${kgs(L.reduce((a,x)=>a+x.avail,0))} kg</span></div><div class="tw" id="fu-tw"></div><div class="pager" id="fu-pager"></div>`;
  [['type','#fu-type'],['cons','#fu-cons'],['comp','#fu-comp'],['col','#fu-col'],['fam','#fu-fam'],['gsm','#fu-gsm'],['b','#fu-b']].forEach(([k,id])=>$(id).onchange=e=>{FU[k]=e.target.value;FU.page=0;fuList(items)});$('#fu-q').oninput=e=>{FU.q=e.target.value;FU.page=0;fuList(items)};
  table('#fu-tw','#fu-pager',L,FUC,FU,()=>fuList(items),null,'reuse lines');
}
function fuSend(items,rts){
  $('#fu-body').innerHTML=`<div class="toolbar"><span class="muted">Jobs marked cutting OK by Cutting, with finished fabric still in stock. Enter the shipment date (from the PO); leftover goes to the reuse list only after shipment.</span><span class="sp"></span><label class="set">Shipment date <input type="date" id="fs-ship" value="${FU.ship}" style="width:auto"></label><select id="fs-loc" class="btn sm">${FLOCS.map(l=>`<option>${l}</option>`).join('')}</select></div>
   <div class="tw"><table><thead><tr><th class="fz">Buyer-Job</th><th>Colour</th><th>Fabric</th><th>GSM</th><th>Dia</th><th class="n">Left in stock</th><th>Cutting OK</th><th></th></tr></thead><tbody>${rts.map(r=>`<tr><td class="fz">${esc(r.b+' '+r.j)}</td><td>${esc(r.c)}</td><td>${esc(r.f)}</td><td>${esc(r.gsm)}</td><td>${esc(r.dia)}</td><td class="n"><b>${kgs(fStock(r))}</b></td><td>${fd(S.cutok[r.b+'|'+r.j].d)}</td><td><button class="btn sm pri" data-i="${r.i}">Send to reuse</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nothing ready. Cutting marks a job "cutting OK" in Issue to Cutting.</td></tr>'}</tbody></table></div>`;
  $('#fs-ship').onchange=e=>{FU.ship=e.target.value};
  $('#fu-body').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(role()!=='Finished Fabric Store')return toast('Finished Fabric Store sends fabric to reuse');const ship=$('#fs-ship').value;if(!ship)return toast('Enter the shipment date');if(ship>TODAY)return toast('Shipment date has not passed yet — keep the fabric for this job');
    const r=F[+b.dataset.i];S.fre[r.i]={kg:Math.round(fStock(r)),ship,loc:$('#fs-loc').value,d:TODAY,by:role()};save();toast(`${kgs(S.fre[r.i].kg)} kg sent to reuse fabric`);refreshAll()});
}
function fuFind(items){
  $('#fu-body').innerHTML=`<div class="split"><div class="panel"><h3>New requirement (fabric order sheet line)</h3><div class="form">
   <div class="row"><span>Job</span><input id="ff-j" placeholder="New job no"></div><div class="row"><span>Fabric type</span><input id="ff-ft" list="ff-ftl"><datalist id="ff-ftl">${uniq(items.map(x=>x.ft)).map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
   <div class="row"><span>Composition</span><input id="ff-cp" placeholder="100% Cotton"></div><div class="row"><span>GSM</span><input type="number" id="ff-g"></div><div class="row"><span>Dia</span><input id="ff-d" placeholder='72"'></div><div class="row"><span>Colour</span><input id="ff-c" placeholder="Black, White C-N100…"></div><div class="row"><span>Process</span><input id="ff-ap" placeholder="Peach, brush, AOP…"></div><div class="row"><span>Finish kg needed</span><input type="number" id="ff-q"></div>
   <div><button class="btn pri" id="ff-go">Find reuse fabric</button></div><div class="muted" style="font-size:12px">Must match: fabric type, composition (when given), GSM ±5%, dia (same or up to 6" wider), colour. AOP / print never matches. Shade is checked against the standard before use.</div></div></div>
   <div class="panel"><h3>Matches</h3><div id="ff-res"><div class="empty">Enter a requirement</div></div></div></div>`;
  $('#ff-go').onclick=()=>{const need={ft:$('#ff-ft').value,comp:$('#ff-cp').value,gsm:$('#ff-g').value,dia:$('#ff-d').value,c:$('#ff-c').value,ap:$('#ff-ap').value};const qty=+$('#ff-q').value||0;
    if(!need.c)return toast('Colour is needed for finished fabric');
    const ms=items.filter(x=>x.avail>=2).map(x=>({x,m:matchScore(need,x,{finished:true})})).filter(o=>o.m.ok).sort((a,b)=>b.m.score-a.m.score||b.x.avail-a.x.avail);
    const tot=ms.reduce((a,o)=>a+o.x.avail,0);
    $('#ff-res').innerHTML=ms.length?`<div style="padding:8px 10px">${pill(kgs(tot)+' kg matching'+(qty?` · covers ${Math.min(100,Math.round(tot/qty*100))}% of ${kgs(qty)} kg`:''),'good')} <button class="btn sm" id="ff-flag">Hold order sheet for check</button></div><table><thead><tr><th>Score</th><th>Colour</th><th>Fabric</th><th>GSM</th><th>Dia</th><th>From job</th><th class="n">kg</th><th>Why / check</th></tr></thead><tbody>${ms.slice(0,40).map(o=>`<tr><td>${o.m.score}</td><td>${esc(o.x.c)}</td><td>${esc(o.x.ft)}</td><td>${esc(o.x.gsm)}</td><td>${esc(o.x.dia)}</td><td>${esc(o.x.j)}</td><td class="n"><b>${kgs(o.x.avail)}</b></td><td style="white-space:normal;min-width:220px">${esc(o.m.why.join(' · '))}${o.m.warn.length?`<div class="muted" style="font-size:11px">${esc(o.m.warn.join(' · '))}</div>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No reuse fabric matches — dye new fabric</div>';
    const fl=$('#ff-flag');if(fl)fl.onclick=()=>{S.fseq++;S.flags.push({id:'f'+S.fseq,job:$('#ff-j').value||'New job',need,qty,matches:ms.map(o=>({rid:o.x.rid,kg:o.x.avail,label:o.x.j+' · '+o.x.c+' · '+o.x.ft+' '+o.x.gsm})),st:'Hold for physical check',d:TODAY,by:role()});save();toast('Sent to Planning: hold this order sheet until the fabric is checked');refreshAll()}};
}
function fuFlags(){
  const L=S.flags.slice().reverse();
  $('#fu-body').innerHTML=L.length?`<div class="toolbar"><input id="fl-note" placeholder="Reason when not suitable (shade off, handfeel…)" style="border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--paper);min-width:320px"></div><div class="tw"><table><thead><tr><th>Job</th><th>Need</th><th class="n">kg</th><th>Matching fabric</th><th>Status</th><th>Decision</th></tr></thead><tbody>${L.map(f=>`<tr><td><b>${esc(f.job)}</b><div class="muted" style="font-size:11px">${fd(f.d)} · ${esc(f.by)}</div></td><td>${esc([f.need.c,f.need.ft,f.need.gsm,f.need.dia].filter(Boolean).join(' · '))}</td><td class="n">${kgs(f.qty)}</td><td style="white-space:normal;min-width:240px">${f.matches.slice(0,4).map(m=>esc(m.label)+' · '+kgs(m.kg)+' kg').join('<br>')}${f.matches.length>4?`<br><span class="muted">+${f.matches.length-4} more</span>`:''}</td><td>${pill(f.st,f.st==='Use stock'?'good':f.st==='Not suitable'?'':'warn')}${f.note?`<div class="muted" style="font-size:11px">${esc(f.note)}</div>`:''}</td><td>${f.st==='Hold for physical check'?`<button class="btn sm pri" data-use="${f.id}">Use stock</button> <button class="btn sm" data-no="${f.id}">Not suitable</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No order sheet checks yet. Use "Hold order sheet for check" in Find a match.</div>';
  const can=()=>['Planning & Control','Merchandiser'].includes(role());
  $('#fu-body').querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{if(!can())return toast('Planning & Control or the merchandiser decides');const f=S.flags.find(x=>x.id===b.dataset.use);let left=f.qty||f.matches.reduce((a,m)=>a+m.kg,0);
    for(const m of f.matches){if(left<=0)break;const it=fReuseItems().find(x=>x.rid===m.rid);if(!it||it.avail<=0)continue;const t=Math.min(left,it.avail);S.resv.push({rid:m.rid,kg:t,job:f.job,d:TODAY,by:role()});left-=t}
    f.st='Use stock';f.note=`${kgs((f.qty||0)-Math.max(0,left))} kg reserved · dye only the rest`;save();toast('Reuse fabric reserved for '+f.job);refreshAll()});
  $('#fu-body').querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{if(!can())return toast('Planning & Control or the merchandiser decides');const n=$('#fl-note').value.trim();if(!n)return toast('Write the reason in the box above');const f=S.flags.find(x=>x.id===b.dataset.no);f.st='Not suitable';f.note=n;save();refreshAll()});
}

/* ---------- demo data (labelled, removable with "Clear demo") ---------- */
function seedDemo(){
  if(S.demoSeeded||!BOOT.user.uiRoles.includes('Finished Fabric Store'))return;S.demoSeeded=true;
  const L=F.filter(r=>fBal(r)>150&&r.rb>0).slice(0,7);
  L.forEach((r,k)=>{S.dseq++;const b=Math.round(Math.min(fBal(r)*0.8,r.rb)),l=Math.round(Math.min(r.rl,40));
    const d={id:'d'+S.dseq,i:r.i,ch:'DEMO-D'+(950+k),body:b,lrib:l,sj:0,rolls:Math.max(1,Math.round((b+l)/20)),d:TODAY,by:'Dyeing Production',st:'Pending',demo:true};
    if(k>=5){d.acc={body:b-2,lrib:l,sj:0,rolls:d.rolls,loc:'F.ST',rack:'1'+k+'B2',n:'',d:TODAY,by:'Finished Fabric Store'};d.st='Accepted'}S.ddel.push(d)});
  const a=L[5];if(a){S.cseq++;S.cut.push({no:'FI-'+String(S.cseq).padStart(4,'0'),i:a.i,lot:'DEMO-CL-1',body:Math.round((a.rb)*0.5),lrib:0,sj:0,d:TODAY,by:'Finished Fabric Store',demo:true});S.cutok[a.b+'|'+a.j]={d:TODAY,by:'Cutting',demo:true}}
  SYNC.demo();
}
function clearDemo(){S.ddel=S.ddel.filter(x=>!x.demo);S.cut=S.cut.filter(x=>!x.demo);Object.keys(S.cutok).forEach(k=>{if(S.cutok[k].demo)delete S.cutok[k]});save();toast('Demo data removed');refreshAll();demoBadge()}
function demoBadge(){const n=S.ddel.filter(x=>x.demo).length+S.cut.filter(x=>x.demo).length;let b=$('#demob');if(!b){b=document.createElement('button');b.id='demob';b.className='demob';$('.top .sp').after(b);b.onclick=clearDemo}b.style.display=n?'':'none';b.textContent=`Demo data (${n}) · Clear`}
seedDemo();demoBadge();
bootApp({fs:renderFS,fr:renderFR,fc:renderFC,fu:renderFU},'fs',()=>{$('#c-fr').textContent=S.ddel.filter(d=>d.st==='Pending').length;$('#c-fu').textContent=readyToSend().length});

}
</script><script>
const NOS={desk:'finished',
  token:()=>{try{return localStorage.getItem('nfl_access_token')||''}catch(e){return''}},
  async api(path,init={}){const headers={'Content-Type':'application/json'};const t=NOS.token();if(t)headers.Authorization='Bearer '+t;
    const res=await fetch('/api'+path,{...init,headers,cache:'no-store'});
    if(res.status===401){try{localStorage.removeItem('nfl_access_token')}catch(e){};location.href='/login';throw new Error('Please log in again')}
    const data=await res.json().catch(()=>({}));if(!res.ok){const m=data.message;throw new Error(typeof m==='string'?m:(m&&m.message)||('Request failed: '+res.status))}return data},
  mark(t){const el=document.getElementById('savestate');if(!el)return;el.textContent=t;clearTimeout(NOS._m);NOS._m=setTimeout(()=>{el.textContent=''},2500)}};
(async()=>{const box=document.getElementById('boot');if(!NOS.token()){location.href='/login';return}
  try{const boot=await NOS.api('/stores/finished/bootstrap');box.remove();document.querySelector('main').style.display='';APP(boot)}catch(e){box.textContent=e.message||'Could not load the store'}})();
</script></body></html>
