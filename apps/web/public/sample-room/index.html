.overlay{display:none}

 </div></div>`;
 const $=id=>document.getElementById(id);

  quotaBox()};
 const fillSub=()=>{$('nSub').innerHTML=uniq(DATA.filter(r=>r.buyerName===$('nBuyerName').value),r=>r.buyer).map(b=>`<option>${esc(b)}</option>`).join('');quotaBox()};

 $('nBuyerName').onchange=fillSub;$('nSub').onchange=quotaBox;$('nG').onchange=fill;fillSub();fill();addC();$('addC').onclick=()=>addC();$('nReset').onclick=()=>render();
 $('nSave').onclick=()=>{const v=id=>$(id).value.trim();

function planningPage(m){
 const sheets=pendingSheets();const ret=(()=>{const mm={};DATA.forEach(r=>{if(r.approval==='Returned')(mm[r.sheetId]=mm[r.sheetId]||[]).push(r)});return Object.values(mm)})();
 const cur=sheets.find(sh=>sh[0].sheetId===planSel);
 const qstat=sh=>{const r=sh[0];const c=catOf(r.types[0]);const ql=QUOTA.find(q=>q.codes.includes(r.buyer));if(!ql)return chip('No quota line','');const u=quotaRows(c).find(q=>q.line===ql.line);if(!u)return chip('No quota','bad');return u.used>u.quota?chip(`Over ${u.used}/${u.quota}`,'bad'):u.used===u.quota?chip(`Full ${u.used}/${u.quota}`,'warn'):chip(`${u.used}/${u.quota}`,'good')};

 ${sheets.length?'':'<div class="empty">No order sheet is waiting. New sheets from merchandisers appear here.</div>'}</div></div>

 </div>${cur?'<aside class="panel side entry open" id="pside"></aside>':''}</div>`;
 m.querySelectorAll('[data-sheet]').forEach(tr=>tr.onclick=()=>{planSel=planSel===tr.dataset.sheet?null:tr.dataset.sheet;render()});

 <div class="body">

}
