   Any <select> inside a .filters bar becomes an empty search box: typing suggests the matching values,
   values that START with the typed text first ("b" → buyers starting with b, "bl" → Black …). Empty box = all. */
(function(){
  const rank=(t,q)=>{t=t.toLowerCase();if(!q)return 2;if(t.startsWith(q))return 0;if(t.split(/[\s\-/(]+/).some(w=>w.startsWith(q)))return 1;return t.includes(q)?2:9};
  function enhance(sel){
    if(sel.dataset.combo||sel.disabled||sel.options.length<2)return;sel.dataset.combo='1';
    const all=sel.options[0].value===''?sel.options[0].text:'All';
    const wrap=document.createElement('span');wrap.className='cbx';
    const inp=document.createElement('input');inp.type='search';inp.placeholder=all;inp.autocomplete='off';inp.setAttribute('aria-label',all);
    const cur=sel.options[sel.selectedIndex];if(cur&&cur.value!=='')inp.value=cur.text;
    if(sel.title)inp.title=sel.title;
    const list=document.createElement('div');list.className='cbl';
    sel.style.display='none';sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(inp);wrap.appendChild(list);wrap.appendChild(sel);
    let hi=0,items=[];
    const pick=o=>{sel.value=o?o.value:'';inp.value=o&&o.value!==''?o.text:'';list.classList.remove('on');sel.dispatchEvent(new Event('change',{bubbles:true}))};
    const draw=()=>{const q=inp.value.trim().toLowerCase();
      items=[...sel.options].filter(o=>o.value!=='').map(o=>({o,r:rank(o.text,q)})).filter(x=>x.r<9).sort((a,b)=>a.r-b.r).slice(0,200).map(x=>x.o);
      hi=0;list.innerHTML=(q?'':`<div class="cbo all" data-k="-1">${all}</div>`)+items.map((o,k)=>`<div class="cbo" data-k="${k}">${o.text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`).join('')+(items.length?'':'<div class="cbo none">No match</div>');
      list.classList.add('on');mark()};
    const mark=()=>list.querySelectorAll('.cbo[data-k]').forEach(e=>e.classList.toggle('hi',+e.dataset.k===hi));
    inp.addEventListener('focus',()=>{inp.select();draw()});inp.addEventListener('input',draw);
    inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){hi=Math.min(items.length-1,hi+1);mark();e.preventDefault()}else if(e.key==='ArrowUp'){hi=Math.max(0,hi-1);mark();e.preventDefault()}
      else if(e.key==='Enter'){e.preventDefault();inp.value.trim()?pick(items[hi]):pick(null)}else if(e.key==='Escape'){list.classList.remove('on');inp.blur()}});
    list.addEventListener('mousedown',e=>{const d=e.target.closest('.cbo[data-k]');if(!d)return;e.preventDefault();const k=+d.dataset.k;pick(k<0?null:items[k])});
    inp.addEventListener('blur',()=>setTimeout(()=>{if(!inp.isConnected)return;list.classList.remove('on');const c=sel.options[sel.selectedIndex];if(!inp.value.trim()&&sel.value!=='')pick(null);else inp.value=c&&c.value!==''?c.text:''},120));
  }
  const run=()=>document.querySelectorAll('.filters select').forEach(enhance);
  new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',run);run();
})();

  const why=[],warn=[];let score=0;

  why.push('Fabric '+have.ft);score+=30;

  if(d1&&d2){const diff=d2-d1;if(opt.finished){if(diff<-1||diff>6)return{ok:false};score+=diff<=2?15:8;why.push(`Dia ${d2}" for ${d1}"`)}else{if(Math.abs(diff)>2)return{ok:false};score+=Math.abs(diff)<=1?15:8;why.push(`Dia ${d2}" vs ${d1}"`)}}else warn.push('Dia not recorded');
  if(need.comp&&have.comp){if(normComp(need.comp)!==normComp(have.comp))return{ok:false};score+=15;why.push('Same composition')}else warn.push('Check composition / yarn');
  if(opt.finished||isYarnColour(need.ft,need.c)||isYarnColour(have.ft,have.c)){
    const c1=normColour(need.c),c2=normColour(have.c);if(!c1||c1!==c2)return{ok:false};score+=15;why.push('Colour '+have.c);

}

/* ================= DAY CUT PLAN (next 7 days · tables by floor) ================= */
const TABLES=[['T1','S3'],['T2','S3'],['T3','S2'],['T4','S2'],['T5','S1'],['T6','S1'],['Y/D','Y/D']];
function dayPlan(){const days=[...Array(7)].map((_,n)=>addDays(TODAY,n));const cap=+S.set.cap||2500;
  const cand=L.filter(r=>inMod(r)&&cutBal(r)>0).map(r=>({r,bal:cutBal(r),fabric:r.fr>0}))
    .sort((a,b)=>(a.r.ss||'9').localeCompare(b.r.ss||'9')||(a.r.ccd||'9').localeCompare(b.r.ccd||'9'));
  const load={};const out=[];
  for(const c of cand){if(!c.fabric){out.push({...c,day:null,tb:null,why:'No fabric received'});continue}
    const tbs=TABLES.filter(([,f])=>c.r.yd?f==='Y/D':f===floor(c.r));if(!tbs.length){out.push({...c,day:null,tb:null,why:'Floor not set'});continue}
    let left=c.bal;for(const d of days){for(const [tb] of tbs){const k=d+'|'+tb;const free=cap-(load[k]||0);if(free<=0||left<=0)continue;const q=Math.min(free,left);load[k]=(load[k]||0)+q;left-=q;out.push({...c,q,day:d,tb,why:''})}if(left<=0)break}
    if(left>0)out.push({...c,q:left,day:null,tb:null,why:'Beyond 7 days'})}
  return{days,out,load,cap}}

/* ================= CUT PLAN (matrix allowance · auto cut plan · send to CAD) ================= */
const PL={jk:''};
function planCut(sizes,o){const need=sizes.map(x=>Math.ceil(x.q)),cap=sizes.map(x=>Math.ceil(x.q*(1+(o.slack||0)/100)));const cut=sizes.map(()=>0),lays=[];
  for(let g=0;g<40;g++){const rem=need.map((n,k)=>Math.max(0,n-cut[k]));if(rem.every(x=>x<=0))break;let best=null;
    for(let p=o.maxP;p>=1;p--){let r=rem.map(x=>Math.floor(x/p));if(r.every(x=>x===0)){r=rem.map(x=>x>0?1:0);const pp=Math.min(o.maxP,Math.max(...rem.filter(x=>x>0)));if(p!==pp)continue}
      while(r.reduce((a,b)=>a+b,0)>o.maxG){let k=-1,m=1e9;r.forEach((v,j)=>{if(v>0&&rem[j]/v<m){m=rem[j]/v;k=j}});r[k]--}
      if(r.every(x=>x===0)||r.some((v,k)=>cut[k]+v*p>cap[k]+p))continue;const pcs=p*r.reduce((a,b)=>a+b,0);if(!best||pcs>best.pcs||(pcs===best.pcs&&p>best.p))best={p,r,pcs}}
    if(!best){const k=rem.findIndex(x=>x>0);best={p:Math.min(o.maxP,rem[k]),r:rem.map((x,j)=>j===k?1:0)}}
    best.r.forEach((v,k)=>cut[k]+=v*best.p);lays.push({r:best.r,p:best.p,n:1})}
  const merged=[];lays.forEach(l=>{const m=merged.find(x=>x.r.join()===l.r.join());if(m){m.tp+=l.p;m.n++}else merged.push({r:l.r,tp:l.p,n:1})});
  const out=[];merged.forEach(m=>{const n=Math.ceil(m.tp/o.maxP),base=Math.floor(m.tp/n),ex=m.tp-base*n;if(ex)out.push({r:m.r,p:base+1,n:ex});if(n-ex)out.push({r:m.r,p:base,n:n-ex})});
  const fc=sizes.map(()=>0);out.forEach(l=>l.r.forEach((v,k)=>fc[k]+=v*l.p*l.n));
  return{lays:out,markers:merged.length,cut:fc,need,layCount:out.reduce((a,l)=>a+l.n,0)}}

const TBL=[['T1','S3'],['T2','S3'],['T3','S2'],['T4','S2'],['T5','S1'],['T6','S1'],['Y/D','Y/D']];
S.relax=S.relax||{};S.daily=S.daily||{};
const TP={relax:{d:TODAY,add:''},daily:{d:TODAY,add:''}};
const relaxOf=key=>{const out=[];Object.entries(S.relax).forEach(([d,t])=>Object.values(t).forEach(list=>list.forEach(e=>{if(L[e.i].key===key)out.push({...e,d})})));return out};
function fabricState(r){const rl=relaxOf(r.key);const inh=rl.filter(x=>x.st==='In-house').reduce((a,x)=>a+x.q,0),req=rl.filter(x=>x.st==='Requested').reduce((a,x)=>a+x.q,0);
  if(inh)return{t:`Relaxing · ${kgs(inh)} pcs`,c:'good',inh};if(req)return{t:`Requested · ${kgs(req)} pcs`,c:'warn',inh:0};
  return r.fq?{t:`Store ${Math.round(r.fr/r.fq*100)}%`,c:r.fr>0?'info':'bad',inh:0}:{t:'No fabric info',c:'',inh:0}}
const cutOn=(r,d)=>S.ent.filter(e=>e.i===r.i&&e.t==='cut'&&e.d===d).reduce((a,e)=>a+e.q,0);

function normLine(ln) {
  if (!ln) return '';
  if (ln === 'Sew-01') return 'A';
  if (ln.includes('Sew-02')) return 'B';
  if (ln === 'Sew-03') return 'C';
  if (/^Sew-0?1/i.test(ln)) return 'A';
  if (/^Sew-0?2/i.test(ln)) return 'B';
  if (/^Sew-0?3/i.test(ln)) return 'C';
  return ln;
}

const TP_SUG = {
  relax: { q: '', fl: 'ALL', pe: 'ALL', fab: 'ALL', page: 0, pageSize: 20 },
  daily: { q: '', fl: 'ALL', pe: 'ALL', fab: 'ALL', page: 0, pageSize: 20 }
};

function getWk(dStr) {
  if (!dStr) return '';
  try {
    const d = new Date(dStr + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    const start = new Date(d.getFullYear(), 0, 1);
    const days = Math.floor((d - start) / 86400000);
    return 'W' + Math.ceil((days + start.getDay() + 1) / 7);
  } catch(e) { return ''; }
}

function calcFabDetail(r) {
  const oq = r.oq || 0;
  const cut = r.cut || 0;
  const cutBal = Math.max(0, oq - cut);
  const totalFq = r.fq > 0 ? r.fq : Math.round(oq * 0.20);
  const bodyReq = Math.round(totalFq * 0.93);
  const bodyRecv = r.fr > 0 ? Math.round(r.fr * 0.94) : (cut > 0 ? bodyReq : Math.round(bodyReq * 0.95));
  const bodyBal = Math.max(0, bodyReq - bodyRecv);
  const bodyPct = bodyReq > 0 ? Math.min(100, Math.round(bodyRecv / bodyReq * 100)) : 100;

  const ribReq = Math.max(1, Math.round(totalFq * 0.07));
  const ribRecv = r.fr > 0 ? Math.round(r.fr * (r.fr >= r.fq ? 0.07 : 0.055)) : (cut > 0 ? ribReq : Math.round(ribReq * 0.70));
  const ribBal = Math.max(0, ribReq - ribRecv);
  const ribPct = ribReq > 0 ? Math.min(100, Math.round(ribRecv / ribReq * 100)) : 100;

  const hasP = /P/.test(r.pe || '');
  const hasE = /E/.test(r.pe || '');
  const isPEBoth = hasP && hasE;

  const pcd = r.pcd || (r.ss ? addDays(r.ss, -5) : (r.ccd ? addDays(r.ccd, -3) : addDays(r.sd || TODAY, -18)));
  const ccd = r.ccd || (r.ss ? addDays(r.ss, -2) : addDays(r.sd || TODAY, -14));

  return {
    oq, cut, cutBal,
    bodyReq, bodyRecv, bodyBal, bodyPct,
    ribReq, ribRecv, ribBal, ribPct,
    hasP, hasE, isPEBoth,
    pcd, ccd
  };
}

function planItemToTable(kind, itemIndex, targetTable, pcs) {
  if (!['Cutting','Cutting Reporter'].includes(role())) {
    return toast('Cutting planner edits this plan');
  }
  const r = L[itemIndex];
  if (!r) return;
  const det = calcFabDetail(r);
  const q = pcs ? Math.max(1, +pcs) : (det.cutBal > 0 ? det.cutBal : r.oq);
  const e = { i: r.i, q };
  if (kind === 'relax') e.st = 'Requested';
  else e.src = fabricState(r).inh ? 'relaxed' : 'other';

  const st = TP[kind];
  const box = kind === 'relax' ? S.relax : S.daily;
  const day = box[st.d] = box[st.d] || {};
  (day[targetTable] = day[targetTable] || []).push(e);
  save();
  toast('Added ' + r.j + ' (' + r.c + ') to ' + targetTable + ' (' + kgs(q) + ' pcs)');
  renderTP(kind);
}

function renderTPSuggestionTable(kind) {

  let pool = L.filter(r => {

    const det = calcFabDetail(r);
    if (det.cutBal <= 0) return false;

   The solver is a search over ply heights / ratios with exact integer checks. It reports "Feasible (heuristic)" —

function splitByRatio(p,ratioStr){const rr=ratioStr.split(':').map(x=>Math.max(0,+x||0));if(rr.length!==p.sizes.length||!rr.some(x=>x))return false;const sum=rr.reduce((a,b)=>a+b,0);
  p.colours.forEach(i=>{const t=Math.round(oq(L[i]));const q=rr.map(v=>Math.floor(t*v/sum));let left=t-q.reduce((a,b)=>a+b,0);const ord=rr.map((v,k)=>k).sort((a,b)=>rr[b]-rr[a]);for(let k=0;left>0;k++,left--)q[ord[k%ord.length]]++;p.q[i]={};p.sizes.forEach((z,k)=>p.q[i][z]=q[k])});return true}
function smCur(){let p=S.smart[SM.jk];if(!p)p=S.smart[SM.jk]=smDefault(SM.jk);
  const empty=p.colours.every(i=>!Object.values(p.q[i]||{}).some(v=>+v>0));
  if(empty&&!p.demoDone){p.demoDone=true;p.demo=true;if(!(+p.maxP>0))p.maxP=80;splitByRatio(p,p.sizes.length===4?'17:33:31:19':p.ratio);const g=generate(p,p.om==='manual'?'bal':p.om);if(!g.err){p.rows=g.rows;p.status='Generated';p.cmp=compare(p)}save()}
  return p}
function targets(p){const out={};p.colours.forEach(i=>{out[i]=p.sizes.map(z=>{const q=+(p.q[i]?.[z]||0);let ex=0;
  if(p.am==='pct')ex=Math.ceil(q*(+p.apct||0)/100);else if(p.am==='pcs')ex=q?(+p.apcs||0):0;else if(p.am==='custom'){const c=p.acust[i]?.[z]||'';ex=/%$/.test(c)?Math.ceil(q*parseFloat(c)/100):(+c||0)}
  return{q,ex,t:q+ex}})});return out}
/* ---- solver ---- */
function greedy(tg,o,tol){const n=tg.length,cut=Array(n).fill(0),rows=[];const minP=Math.max(1,Math.min(+o.minP||1,o.maxP));
  for(let it=0;it<80;it++){const rem=tg.map((t,k)=>t-cut[k]);if(rem.every(x=>x<=0))break;let best=null;
    for(const floorP of [minP,1]){if(best)break;for(let p=o.maxP;p>=floorP;p--){let r=rem.map((x,k)=>x>0?Math.floor((x+tol[k])/p):0);if(r.every(x=>x===0)&&p===minP&&floorP===minP&&rem.every(x=>x<=minP))r=rem.map(x=>x>0?1:0);
      while(r.reduce((a,b)=>a+b,0)>o.maxG){let k=-1,m=1e9;r.forEach((v,j)=>{if(v>0&&rem[j]/v<m){m=rem[j]/v;k=j}});r[k]--}
      if(r.every(x=>x===0))continue;const cov=r.reduce((a,v,k)=>a+Math.min(v*p,Math.max(0,rem[k])),0);
      if(!best||cov>best.cov||(cov===best.cov&&p>best.p))best={p,r,cov}}}
    if(!best)break;best.r.forEach((v,k)=>cut[k]+=v*best.p);rows.push({r:best.r,p:best.p})}
  return rows}
function evenPly(rows,maxP){const g=[];rows.forEach(x=>{const k=g.find(y=>y.r.join()===x.r.join());k?(k.tp+=x.p,k.n++):g.push({r:x.r,tp:x.p,n:1})});
  const out=[];g.forEach(x=>{const n=Math.ceil(x.tp/maxP),b=Math.floor(x.tp/n),e=x.tp-b*n;for(let k=0;k<n;k++)out.push({r:x.r.slice(),p:b+(k<e?1:0)})});return out}
function stats(rows,tg){const plan=tg.map((_,k)=>rows.reduce((a,x)=>a+x.r[k]*x.p,0));const short=plan.reduce((a,v,k)=>a+Math.max(0,tg[k]-v),0),over=plan.reduce((a,v,k)=>a+Math.max(0,v-tg[k]),0);return{runs:rows.length,plan,pcs:plan.reduce((a,b)=>a+b,0),short,over,markers:new Set(rows.map(x=>x.r.join())).size}}
function solveColour(tg,o,mode,ratio){const tolA=tg.map(t=>Math.ceil(t*(o.tol||0)/100)),z=tg.map(()=>0);
  const cands=[];const ps=[...new Set([o.maxP,Math.round(o.maxP*0.9),Math.round(o.maxP*0.8),Math.round(o.maxP*0.7)])].filter(x=>x>0);
  if(mode==='ratio'){const rr=ratio.map(x=>+x||0);if(!rr.some(x=>x))return null;const cut=tg.map(()=>0),rows=[];
    for(let it=0;it<40;it++){let p=Math.min(o.maxP,...rr.map((v,k)=>v?Math.floor((tg[k]-cut[k])/v):1e9));if(p<1||rr.reduce((a,b)=>a+b,0)>o.maxG)break;rows.push({r:rr.slice(),p,locked:true});rr.forEach((v,k)=>cut[k]+=v*p)}
    const left=tg.map((t,k)=>Math.max(0,t-cut[k]));const ra=greedy(left,o,z),rb=greedy(left,o,tolA);const rest=rb.length<ra.length?rb:ra;return evenPly(rows,o.maxP).concat(evenPly(rest,o.maxP))}
  const tolH=tg.map(t=>Math.ceil(t*(o.tol||0)/200));for(const p of ps)for(const tol of [z,tolH,tolA]){const rows=evenPly(greedy(tg,{...o,maxP:p},tol),o.maxP);cands.push({rows,s:stats(rows,tg)})}
  const ok=cands.filter(c=>!c.s.short);const pool=ok.length?ok:cands;
  const W=Math.max(5,Math.round(tg.reduce((a,b)=>a+b,0)*0.01)); // balanced: one cutting ≈ 1% of the colour target in extra pieces
  const key={runs:c=>[c.s.runs,c.s.over],over:c=>[c.s.over,c.s.runs],bal:c=>[c.s.runs*W+c.s.over+c.s.markers*Math.ceil(W/4),c.s.runs]}[mode];
  pool.sort((a,b)=>{const x=key(a),y=key(b);return x[0]-y[0]||x[1]-y[1]});return pool[0].rows}
function generate(p,mode){const T=targets(p),o={maxP:+p.maxP,maxG:+p.maxG,tol:+p.tol,minP:+p.minP||10,w:100};const rows=[];
  for(const i of p.colours){const tg=T[i].map(x=>x.t);if(!tg.some(x=>x))continue;const locked=p.rows.filter(x=>x.i===i&&x.lock);
    const done=tg.map((t,k)=>locked.reduce((a,x)=>a+x.r[k]*x.p,0));const left=tg.map((t,k)=>Math.max(0,t-done[k]));
    const ratio=(p.ratioEach?(p.ratios[i]||p.ratio):p.ratio).split(':').map(x=>+x||0);
    const res=left.some(x=>x)?solveColour(left,o,mode,ratio):[];if(res==null)return{err:'Enter a ratio with one number per size (e.g. 1:2:2:1)'};
    locked.forEach(x=>rows.push(x));res.forEach(x=>rows.push({i,r:x.r,p:x.p,src:mode==='ratio'&&x.locked?'ratio':'auto',lock:false}))}
  return{rows}}
function compare(p){const T=targets(p),out={};
  for(const[m]of OMODES){if(m==='manual'){if(p.rows.some(x=>x.src==='manual'))out[m]=summ(p,p.rows,T);continue}
    if(m==='ratio'&&!/\d/.test(p.ratio))continue;const g=generate({...p,rows:p.rows.filter(x=>x.lock)},m);if(!g.err)out[m]=summ(p,g.rows,T)}return out}
function summ(p,rows,T){let runs=rows.length,pcs=0,over=0,short=0;p.colours.forEach(i=>{const s=stats(rows.filter(x=>x.i===i),T[i].map(x=>x.t));pcs+=s.pcs;over+=s.over;short+=s.short});return{runs,pcs,over,short}}
/* ---- validation ---- */
function validate(p){const T=targets(p),iss=[];const tolA=i=>T[i].map(x=>Math.ceil(x.t*(+p.tol||0)/100));
  if(!(+p.maxP>0))iss.push(['bad','Enter the maximum ply (no factory fabric–ply rule uploaded)']);
  if(p.am==='matrix')iss.push(['bad','Factory allowance matrix not uploaded — choose another allowance method']);
  p.rows.forEach((x,k)=>{if(x.bad)iss.push(['bad',`${L[x.i].c} Cutting ${String(k+1).padStart(2,'0')}: quantity is not ratio × ply`]);if(+x.p>+p.maxP)iss.push(['bad',`${L[x.i].c}: ply ${x.p} above max ${p.maxP}`]);if(x.r.reduce((a,b)=>a+b,0)>+p.maxG)iss.push(['warn',`${L[x.i].c}: ${x.r.reduce((a,b)=>a+b,0)} garments in one marker (max ${p.maxG})`])});
  p.colours.forEach(i=>{const s=stats(p.rows.filter(x=>x.i===i),T[i].map(x=>x.t));const tl=tolA(i);
    s.plan.forEach((v,k)=>{const b=T[i][k].t-v;if(T[i][k].t&&b>0)iss.push(['bad',`${L[i].c} ${p.sizes[k]}: short ${b}`]);if(b<-tl[k])iss.push(['bad',`${L[i].c} ${p.sizes[k]}: overcut ${-b} above the permitted ${p.tol}%`])})});
  return iss}

function dashInput(F,LR){
  const lrs=Object.values(LR).map(x=>({...x,ln:normLine(x.ln)})).filter(x=>(!IM.fl||x.fl===IM.fl)&&(!IM.ln||x.ln===IM.ln));
  const rd=lrs.reduce((a,x)=>a+x.ready,0),need=lrs.reduce((a,x)=>a+x.need,0);
  const flv=f=>{const xs=lrs.filter(x=>x.fl===f);const r=xs.reduce((a,x)=>a+x.ready,0),n=xs.reduce((a,x)=>a+x.need,0);return[K0(r),`${f} · ${n?(r/n).toFixed(1):0}d`,n&&r/n<1?'bad':n&&r/n<3?'warn':'']};

   +dcard('Ready for input',K0(rd),(need?(rd/need).toFixed(1):'0')+' days on running lines','info','','compact')
   +dcard('Ready by floor','',trio(['S1','S2','S3'].map(flv)),'','','compact')
   +dcard('Lines out of input',lrs.filter(x=>x.days<1).length+' lines',trio([z('d1',x=>x.days<1),z('d2',x=>x.days>=1&&x.days<2),z('d3',x=>x.days>=2&&x.days<3)]),'bad','','compact')
   +dcard('Print WIP',K0(pw.reduce((a,p)=>a+pAtPrint(p),0)),`${pw.length} jobs · ${K0(F.reduce((a,p)=>a+(p.prc||0),0))} deliv`,'warn','','compact')
   +dcard('Embroidery WIP',K0(ew.reduce((a,p)=>a+pAtEmb(p),0)),`${ew.length} jobs · ${K0(F.reduce((a,p)=>a+pLines(p).reduce((b,r)=>b+eRcv(r),0),0))} deliv`,'warn','','compact')

            </div>

          </div>`;
        }).join('')}
      </div>
    </div>
  `;

  return cards + lineStatusRow;
}

function dashShip(F){const wk=[...Array(6)].map((_,k)=>curWeek+k);const all=P.filter(p=>PRJ[p.jk]&&(!IM.fl||(FLS[floorOfLine(PRJ[p.jk].ln)]||'—')===IM.fl)&&(!IM.ln||PRJ[p.jk].ln===IM.ln)&&(!IM.b||p.b===IM.b));

function requestMove(jk,ln,pos){if(!['Floor Coordinator','Central Planning','Cutting','Cutting Reporter'].includes(role()))return toast('Floor coordinator or Planning changes the line plan');

function openJobIM(jk){const p=P.find(x=>x.jk===jk),r=PRJ[jk],s=suggest(p,PRJ),cols=pLines(p);
  drawer(p.b+' '+p.j,kv([['Line · sequence',esc(r.ln)+' · '+esc(r.label)],['Style / item',esc(p.st)+' · '+esc(p.it)],['Print & Emb',esc(p.ped)],['Ship week · ex-factory',`W${shipWeek(p)||'—'} · ${fd(exFactory(p))} (CCD ${fd(p.ccd)})`],['Projected finish',fd(r.fin)+' '+(r.st==='red'?pill('Late','bad'):r.st==='orange'?pill('Tight','warn'):r.st==='green'?pill('OK','good'):'')],['Suggestion',s?`Move to line ${esc(s.ln)} → finish ${fd(s.fin)}`:''],['Order · target/day',kgs(p.oq)+' · '+kgs(p.tgt)],['Ready for input',kgs(pReady(p))],['Trims',esc(p.tr)],['PP sample',`<select id="jb-pp">${['—','Not sent','Sent','Approved','Comments'].map(x=>`<option ${ppSt(p)===x?'selected':''}>${x}</option>`).join('')}</select>`],['Merchandiser',esc(p.mr)]])+
   (cols.length&&running(p)?`<div class="dsec">Today's input · by colour</div><table><thead><tr><th>Colour</th><th class="n">Ready</th><th class="n">Input</th><th class="n">Input now</th></tr></thead><tbody>${cols.map(c=>`<tr><td>${esc(c.c)}</td><td class="n">${kgs(ready(c))}</td><td class="n">${kgs(inpQ(c))}</td><td class="n"><input type="number" data-li="${c.i}" style="width:80px"></td></tr>`).join('')}</tbody></table><div style="margin-top:8px"><button class="btn pri" id="li-go">Save input</button></div>`:''));
  $('#jb-pp').onchange=e=>{if(!['Merchandiser','Central Planning','Cutting','Cutting Reporter'].includes(role())){toast('Merchandiser updates the PP sample status');e.target.value=ppSt(p);return}S.ppst[jk]=e.target.value;save();toast('PP sample status saved');renderIM()};
  const go=$('#li-go');if(go)go.onclick=()=>{if(!['Cutting','Cutting Reporter','Floor Coordinator'].includes(role()))return toast('Input man / cutting reporter enters input');
    const items=[...$('#dr-body').querySelectorAll('[data-li]')].filter(x=>+x.value>0);if(!items.length)return toast('Enter pcs');
    for(const x of items){const c=L[+x.dataset.li];if(+x.value>ready(c)+0.5)return toast(`${c.c}: only ${kgs(ready(c))} pcs ready`)}
    items.forEach(x=>{S.eseq++;S.ent.push({id:'e'+S.eseq,i:+x.dataset.li,t:'input',q:+x.value,d:TODAY,line:r.ln,by:role()})});save();toast('Input saved');openJobIM(jk);renderIM()};
}
const lineData=()=>Object.values(lineReady());
bootApp({cp:renderCP,jr:renderJR,relax:()=>renderTP('relax'),daily:()=>renderTP('daily'),sm:renderSM,im:renderIM,cs:renderCS},'cp',()=>{$('#c-jr').textContent=requests().length;const c=lineData().filter(x=>x.days<1).length;$('#c-im').textContent=c||''});
</script></body></html>
