function gAccepted(r){return S.kdel.filter(d=>d.i===r.i&&(d.st==='Accepted'||d.st==='QC pending'))}
function gRecv(r){return r.rq+gAccepted(r).reduce((a,d)=>a+d.acc.kg,0)}
function gQcHold(r){return S.kdel.filter(d=>d.i===r.i&&d.st==='QC pending').reduce((a,d)=>a+d.acc.kg,0)}
function gIssued(r){return r.iq+S.giss.filter(x=>x.i===r.i).reduce((a,x)=>a+x.kg,0)}
function gStock(r){return gRecv(r)-gIssued(r)}
function gAvail(r){return gStock(r)-gQcHold(r)-(S.reuse[r.i]?.st==='In reuse'?S.reuse[r.i].kg:0)}
function gKnitBal(r){return Math.max(0,r.gq-gRecv(r))}
function gLastRecv(r){const a=gAccepted(r).map(d=>d.acc.d);return [r.rd,...a].filter(Boolean).sort().pop()||''}
function gAge(r){const s=gStock(r);if(s<=0.5)return null;const d=gLastRecv(r);if(!d)return null;return Math.max(0,dayDiff(d,d>AS_OF?TODAY:AS_OF))} // report data is a 28 Sep snapshot
function gStatus(r){const s=gStock(r);
  if(s<-5)return'Negative stock'; // small minus = weighing difference
  if(gQcHold(r)>0)return'QC hold';
  if(s>0.5&&gKnitBal(r)>0.5)return'Partly received';
  if(s>0.5)return'In stock';
  if(gKnitBal(r)>0.5&&gRecv(r)>0)return'Knitting balance';
  if(gRecv(r)<=0)return'Not received';
  return'Fully issued'}
const GSTC={'Negative stock':'bad','QC hold':'warn','Partly received':'info','In stock':'good','Knitting balance':'warn','Not received':'','Fully issued':''};
function gLocs(r){return LOCS.map((l,k)=>{const base=k===0?r.l1:k===1?r.l2:r.l3;return base+gAccepted(r).filter(d=>d.acc.loc===l).reduce((a,d)=>a+d.acc.kg,0)-S.giss.filter(x=>x.i===r.i&&x.loc===l).reduce((a,x)=>a+x.kg,0)})}

/* ================= DELIVERY REQUESTS FROM DYEING =================
   In-house (NFL): dyeing creates a batch → a request for that batch's greige kg.
   Subcontract: a dyeing work order → the factory takes greige as it arrives (300 now, 200 later, or all at once). */
const GQ={tab:'Open',sel:null};
function reqDone(q){return S.giss.filter(x=>x.req===q.id).reduce((a,x)=>a+x.kg,0)}
function reqBal(q){return Math.max(0,q.kg-reqDone(q))}
function renderGQ(){
  const open=S.req.filter(q=>q.st==='Open');
  const ih=open.filter(q=>q.type==='In-house batch'),sc=open.filter(q=>q.type!=='In-house batch');
  const ready=sc.filter(q=>gAvail(G[q.i])>=5),wait=open.filter(q=>gAvail(G[q.i])<Math.min(5,reqBal(q)));
  $('#gq-cards').innerHTML=card2('In-house batch requests',ih.length+'<span class="k"> open</span>',kgs(ih.reduce((a,q)=>a+reqBal(q),0))+' kg to deliver','warn')
   +card2('Subcontract work orders',sc.length+'<span class="k"> open</span>',kgs(sc.reduce((a,q)=>a+reqBal(q),0))+' kg balance','warn')
   +card2('Subcontract · greige ready to send',ready.length+'<span class="k"> WOs</span>',kgs(ready.reduce((a,q)=>a+Math.min(reqBal(q),gAvail(G[q.i])),0))+' kg in stock now','good')
   +card2('Waiting for greige',wait.length+'<span class="k"> requests</span>','not in stock yet (knitting / QC)','bad')
   +card2('Delivered today',kgs(S.giss.filter(x=>x.d===TODAY).reduce((a,x)=>a+x.kg,0))+'<span class="k"> kg</span>',S.giss.filter(x=>x.d===TODAY).length+' deliveries');
  const tabs=['Open','Done','All'];
  $('#gq-tabs').innerHTML=tabs.map(t=>`<button class="${GQ.tab===t?'on':''}" data-t="${t}">${t} (${t==='All'?S.req.length:S.req.filter(q=>t==='Done'?q.st!=='Open':q.st===t).length})</button>`).join('');
  $('#gq-tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{GQ.tab=b.dataset.t;GQ.sel=null;renderGQ()});
  const L=S.req.filter(q=>GQ.tab==='All'||(GQ.tab==='Done'?q.st!=='Open':q.st==='Open')).slice().reverse();
  $('#gq-list').innerHTML=L.length?L.map(q=>{const r=G[q.i],av=gAvail(r);return `<div class="pi ${GQ.sel===q.id?'sel':''}" data-id="${q.id}" style="grid-template-columns:1fr auto"><div><div class="a">${esc(q.ref)} · ${esc(r.b+' '+r.j)}</div><div class="b">${esc(r.c)} · ${esc(r.ft)} ${esc(r.gsm)} · ${pill(q.type==='In-house batch'?'NFL batch':'Sub · '+q.fac,q.type==='In-house batch'?'':'info')} ${q.st==='Open'&&av<Math.min(5,reqBal(q))?pill('No greige','bad'):''}</div></div><div style="text-align:right"><b>${kgs(reqBal(q))} kg</b><div class="b">of ${kgs(q.kg)} · stock ${kgs(av)}</div></div></div>`}).join(''):`<div class="empty">${GQ.tab==='Open'?'No open delivery requests. In the connected ERP they come from the dyeing desk (batch card created / work order approved); here the Dyeing Planner can post one below.':'Nothing here'}</div>`;
  $('#gq-list').querySelectorAll('.pi').forEach(el=>el.onclick=()=>{GQ.sel=el.dataset.id;renderGQ()});
  const q=S.req.find(x=>x.id===GQ.sel);
  if(!q){$('#gq-form').innerHTML=reqPostForm();bindReqPost();return}
  const r=G[q.i],av=gAvail(r),bal=reqBal(q),done=S.giss.filter(x=>x.req===q.id);
  let h=kv([['Request',esc(q.no)+' · '+esc(q.type)],['Against',esc(q.ref)],['Job / colour',esc(r.b+' '+r.j+' · '+r.c)],['Fabric',esc([r.ft,r.gsm,r.dia].filter(Boolean).join(' · '))],['Dyeing at',esc(q.fac)],['Requested',kgs(q.kg)+' kg'],['Delivered',kgs(reqDone(q))+' kg'],['Balance',`<b>${kgs(bal)} kg</b>`],['Greige available',kgs(av)+' kg (QC-passed, not in reuse)']]);
  if(done.length)h+=`<table><thead><tr><th>Delivery</th><th>Date</th><th>From</th><th class="n">kg</th></tr></thead><tbody>${done.map(x=>`<tr><td>${esc(x.no)}</td><td>${fd(x.d)}</td><td>${esc(x.loc)}</td><td class="n">${kgs(x.kg)}</td></tr>`).join('')}</tbody></table>`;
  if(q.st==='Open'){
    const def=Math.round(Math.min(bal,av));
    h+=`<div class="form"><div class="row"><span>Deliver kg</span><input type="number" id="qd-kg" value="${def>0?def:''}"></div><div class="row"><span>From location</span><select id="qd-loc">${LOCS.map(l=>`<option>${l}</option>`).join('')}</select></div><div class="row"><span>Rolls</span><input type="number" id="qd-r"></div>
     <div><button class="btn pri" id="qd-go">Deliver</button> ${q.type!=='In-house batch'?'<button class="btn" id="qd-close">Close balance</button>':''}</div>
     <div class="muted" style="font-size:12px">${q.type==='In-house batch'?'A batch card needs its full greige weight; deliver the whole batch qty.':'Subcontract: deliver what is in stock now; the balance stays open for the next delivery.'}</div></div>`;
  }
  $('#gq-form').innerHTML=`<div style="padding:10px">${h}</div>`;
  const go=$('#qd-go');if(go){go.onclick=()=>{if(role()!=='Greige Store')return toast('Greige Store delivers greige');const k=+$('#qd-kg').value;if(!(k>0))return toast('Enter the kg');if(k>av+0.5)return toast(`Only ${kgs(av)} kg available`);if(k>bal+bal*0.03+1)return toast(`Balance on this request is ${kgs(bal)} kg`);
      if(q.type==='In-house batch'&&k<bal*0.97)return toast(`The batch needs ${kgs(bal)} kg — not enough greige yet`);
      S.gseq++;S.giss.push({no:'GD-'+String(S.gseq).padStart(4,'0'),req:q.id,i:q.i,ref:q.ref,kg:k,loc:$('#qd-loc').value,rolls:+$('#qd-r').value||0,d:TODAY,by:role()});if(reqBal(q)<=0.5)q.st='Done';save();toast(`Delivered ${kgs(k)} kg against ${q.ref}`+(q.st==='Open'?` · ${kgs(reqBal(q))} kg balance open`:''));refreshAll()};
    const cl=$('#qd-close');if(cl)cl.onclick=()=>{if(role()!=='Greige Store')return toast('Greige Store closes requests');q.st='Closed';q.closed=TODAY;save();toast('Balance closed');refreshAll()}}
}

  <div class="row"><span>Job / colour</span><input id="rq-q" placeholder="Type job no or colour" list="rq-dl"><datalist id="rq-dl"></datalist></div>
  <div class="row"><span>Type</span><select id="rq-t"><option>In-house batch</option><option>Subcontract WO</option></select></div>
  <div class="row"><span>Batch card / WO no</span><input id="rq-ref" placeholder="BC-261029-001 or DWO-26-0012"></div><div class="row"><span>Factory</span><input id="rq-f" value="NFL" list="rq-fl"><datalist id="rq-fl">${uniq(G.map(r=>r.sdf)).map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
  <div class="row"><span>Greige kg</span><input type="number" id="rq-kg"></div><div><button class="btn pri" id="rq-go">Send delivery request</button></div></div>`}
function bindReqPost(){const q=$('#rq-q');q.oninput=()=>{const s=q.value.trim().toLowerCase();if(s.length<2)return;$('#rq-dl').innerHTML=G.filter(r=>(r.j+' '+r.c).toLowerCase().includes(s)).slice(0,30).map(r=>`<option value="${esc(r.j+' · '+r.c+' · '+r.ft+' #'+r.i)}">`).join('')};
  $('#rq-t').onchange=e=>{$('#rq-f').value=e.target.value==='In-house batch'?'NFL':''};
  $('#rq-go').onclick=()=>{if(role()!=='Dyeing Planner')return toast('Dyeing Planner sends delivery requests');const m=q.value.match(/#(\d+)$/);if(!m)return toast('Pick the job / colour from the list');const k=+$('#rq-kg').value,ref=$('#rq-ref').value.trim(),t=$('#rq-t').value,f=$('#rq-f').value.trim();if(!ref)return toast('Enter the batch card / WO no');if(!(k>0))return toast('Enter the kg');if(t!=='In-house batch'&&(!f||f==='NFL'))return toast('Enter the subcontract factory');
    S.rseq++;S.req.push({id:'q'+S.rseq,no:'GR-'+String(S.rseq).padStart(4,'0'),type:t,ref,i:+m[1],kg:k,fac:t==='In-house batch'?'NFL':f,d:TODAY,by:role(),st:'Open'});save();toast('Delivery request sent to Greige Store');GQ.tab='Open';refreshAll()}}

/* ================= REUSE STOCK =================
   Greige left after the job's batches are dyed goes to the reuse list (after the store checks it),
   together with the useable excess list. Knitting and merchandising see matches before planning new knitting. */
const GU={tab:'list',type:'',cons:'',comp:'',col:'',gsm:'',q:'',sel:new Set()};
function toCheck(){return G.filter(r=>!S.reuse[r.i]&&gStock(r)>=5&&gQcHold(r)<=0&&r.de&&r.de<AS_OF)}
function reserved(rid){return S.resv.filter(x=>x.rid===rid).reduce((a,x)=>a+x.kg,0)}
function reuseItems(){
  const out=[];
  G.forEach(r=>{const u=S.reuse[r.i];if(u&&u.st==='In reuse'){const kgv=Math.min(u.kg,Math.max(0,gStock(r)));out.push({rid:'L'+r.i,src:'Left after dyeing',b:r.b,j:r.j,c:r.c,ft:r.ft,gsm:r.gsm,dia:r.dia,yarn:[r.yb,r.yl].filter(Boolean).join(' · '),kg:kgv,loc:u.loc,d:u.d,i:r.i})}});
  A.forEach((a,k)=>{if(a.t==='Useable excess'&&a.q>0)out.push({rid:'X'+k,src:'Useable excess list',b:a.b,j:a.j,c:a.c,ft:a.ft,gsm:a.gsm,dia:a.dia,kg:a.q,loc:'',d:'',note:a.rm})});
  out.forEach((x,k)=>{x.avail=Math.max(0,x.kg-reserved(x.rid));x.i=k;x.jc=x.j;x.type=fabType(x.ft);x.cons=fabConstruction(x.ft);x.comp=fabComposition(x.ft);x.col=colourName(x.c)});return out;
}
function knitAlerts(){
  const items=reuseItems().filter(x=>x.avail>=10),out=[];
  for(const r of G){const b=gKnitBal(r);if(b<20||gRecv(r)>0&&b<20)continue;
    const need={ft:r.ft,gsm:r.gsm,dia:r.dia,c:r.c};let ms=[];
    for(const x of items){if(x.j===r.j)continue;const m=matchScore(need,x,{finished:false});if(m.ok)ms.push({x,m})}
    if(ms.length){ms.sort((a,b)=>b.m.score-a.m.score||b.x.avail-a.x.avail);out.push({r,b,ms,cover:Math.min(b,ms.reduce((a,o)=>a+o.x.avail,0))})}}
  const used={};out.forEach(o=>o.ms.forEach(m=>{used[m.x.rid]=used[m.x.rid]||{kg:m.x.avail,n:0};used[m.x.rid].n++}));
  out.uniqueKg=Object.values(used).reduce((a,u)=>a+u.kg,0);out.shared=used; // each kg of reuse stock counted once
  return out.sort((a,b)=>b.cover-a.cover);
}
function renderGU(){
  const items=reuseItems(),tc=toCheck(),ka=knitAlerts();const kaU=ka.uniqueKg||0;
  const tot=items.reduce((a,x)=>a+x.avail,0),res=S.resv.reduce((a,x)=>a+x.kg,0);
  $('#gu-cards').innerHTML=card2('Reuse greige available',kgs(tot)+'<span class="k"> kg</span>',items.length+' lines','good')
   +card2('Left after dyeing · to check',tc.length+'<span class="k"> lines</span>',kgs(tc.reduce((a,r)=>a+gStock(r),0))+' kg not yet sorted','warn','tab:check')
   +card2('Could replace new knitting',ka.length+'<span class="k"> jobs</span>',kgs(kaU)+' kg reuse stock matches their pending knitting','bad','tab:knit')
   +card2('Reserved for jobs',kgs(res)+'<span class="k"> kg</span>',S.resv.length+' reservations')
   +card2('Order sheet checks on hold',S.flags.filter(f=>f.st==='Hold for physical check').length+'<span class="k"> jobs</span>','Planning holds approval until checked','warn','tab:flags');
  $('#gu-cards').querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>{GU.tab=el.dataset.act.slice(4);renderGU()});
  const bt={};items.forEach(x=>{bt[x.ft||'—']=(bt[x.ft||'—']||0)+x.avail});
  const gb={};items.forEach(x=>{const g=numOf(x.gsm);const k=!g?'—':g<160?'< 160':g<200?'160–199':g<250?'200–249':g<300?'250–299':'300+';gb[k]=(gb[k]||0)+x.avail});
  $('#gu-charts').innerHTML=`<div class="chart"><h4>Reuse greige by fabric type (kg)</h4>${hbars(Object.entries(bt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t,v])=>({t,v:[v],lab:kgs(v)+' kg'})),[C4])}</div><div class="chart"><h4>Reuse greige by GSM (kg)</h4>${colbars(['< 160','160–199','200–249','250–299','300+','—'].map(k=>({x:k,v:[gb[k]||0],tip:k+': '+kgs(gb[k]||0)+' kg'})),[C1])}</div>`;
  const tabs=[['list','Reuse list ('+items.length+')'],['check','To check ('+tc.length+')'],['knit','Knitting alerts ('+ka.length+')'],['find','Find a match'],['flags','Order sheet checks ('+S.flags.length+')']];
  $('#gu-tabs').innerHTML=tabs.map(([k,l])=>`<button class="${GU.tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#gu-tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{GU.tab=b.dataset.t;GU.sel.clear();renderGU()});
  ({list:guList,check:guCheck,knit:guKnit,find:guFind,flags:guFlags})[GU.tab](items,tc,ka);
}
const GUC=[{g:'Fabric',h:'Type',v:x=>esc(x.type)},{g:'Fabric',h:'Construction',v:x=>esc(x.cons)},{g:'Fabric',h:'Composition',v:x=>esc(x.comp)},{g:'Fabric',h:'Fabric',v:x=>esc(x.ft)},{g:'Fabric',h:'GSM',v:x=>esc(x.gsm)},{g:'Fabric',h:'Dia',v:x=>esc(x.dia)},{g:'Fabric',h:'Yarn',v:x=>esc(x.yarn)},{g:'Fabric',h:'Colour',v:x=>esc(x.col)},
 {g:'Stock',h:'Available kg',n:1,v:x=>`<b>${kgs(x.avail)}</b>`,f:x=>String(Math.round(x.avail))},{g:'Stock',h:'Reserved',n:1,v:x=>kg(reserved(x.rid))},{g:'Stock',h:'Location',v:x=>esc(x.loc)},{g:'Stock',h:'Since',v:x=>fd(x.d)},{g:'Stock',h:'Source',v:x=>pill(x.src==='Left after dyeing'?'Left over':'Excess list','info'),f:x=>x.src}];
GU.page=0;GU.cf={};
function guList(items){
  const q=GU.q.toLowerCase();
  const L=items.filter(x=>(!GU.type||x.type===GU.type)&&(!GU.cons||x.cons===GU.cons)&&(!GU.comp||x.comp===GU.comp)&&(!GU.col||x.col===GU.col)&&(!GU.gsm||String(x.gsm)===GU.gsm)&&(!q||(x.j+' '+x.c+' '+x.b+' '+x.ft).toLowerCase().includes(q))).sort((a,b)=>(a.type||'').localeCompare(b.type||'')||(numOf(a.gsm)||0)-(numOf(b.gsm)||0));

  [['type','#gu-type'],['cons','#gu-cons'],['comp','#gu-comp'],['col','#gu-col'],['gsm','#gu-gsm']].forEach(([k,id])=>$(id).onchange=e=>{GU[k]=e.target.value;GU.page=0;guList(items)});$('#gu-q').oninput=e=>{GU.q=e.target.value;GU.page=0;guList(items)};
  table('#gu-tw','#gu-pager',L,GUC,GU,()=>guList(items),null,'reuse lines');

function guCheck(items,tc){
  const L=tc.slice().sort((a,b)=>gStock(b)-gStock(a)).slice(0,400);
  $('#gu-body').innerHTML=`<div class="toolbar"><span class="muted">Greige still in stock after the job's dyeing close date. Check physically, then send to the reuse list or mark not reusable.</span><span class="sp"></span><span class="muted">${GU.sel.size} selected</span><select id="gc-loc" class="btn sm">${LOCS.map(l=>`<option>${l}</option>`).join('')}</select><button class="btn sm" id="gc-all">Select all shown</button><button class="btn sm pri" id="gc-go">Send to reuse list</button><input id="gc-why" placeholder="Reason if not reusable" style="border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:var(--paper)"><button class="btn sm" id="gc-no">Not reusable</button></div>
   <div class="tw"><table><thead><tr><th></th><th class="fz">Buyer-Job</th><th>Colour</th><th>Fabric</th><th>GSM</th><th>Dia</th><th class="n">Stock kg</th><th>Dyeing closed</th><th class="n">Days since</th></tr></thead><tbody>${L.map(r=>`<tr data-i="${r.i}"><td><input type="checkbox" ${GU.sel.has(r.i)?'checked':''}></td><td class="fz">${esc(r.b+' '+r.j)}</td><td>${esc(r.c)}</td><td>${esc(r.ft)}</td><td>${esc(r.gsm)}</td><td>${esc(r.dia)}</td><td class="n"><b>${kgs(gStock(r))}</b></td><td>${fd(r.de)}</td><td class="n">${dayDiff(r.de,AS_OF)}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">Nothing to check</td></tr>'}</tbody></table></div>`;
  $('#gu-body').querySelectorAll('tbody tr[data-i]').forEach(tr=>tr.onclick=()=>{const i=+tr.dataset.i;GU.sel.has(i)?GU.sel.delete(i):GU.sel.add(i);guCheck(items,tc)});
  $('#gc-all').onclick=()=>{L.forEach(r=>GU.sel.add(r.i));guCheck(items,tc)};
  const act=st=>{if(role()!=='Greige Store')return toast('Greige Store sorts left-over greige');if(!GU.sel.size)return toast('Select lines first');let why='';if(st==='Not reusable'){why=$('#gc-why').value.trim();if(!why)return toast('Write the reason (damaged, wrong GSM, mixed lot…)')}
    GU.sel.forEach(i=>{S.reuse[i]={st,kg:gStock(G[i]),loc:$('#gc-loc').value,why,d:TODAY,by:role()}});const n=GU.sel.size;GU.sel.clear();save();toast(`${n} line${n>1?'s':''} → ${st==='In reuse'?'reuse list':'not reusable'}`);refreshAll()};
  $('#gc-go').onclick=()=>act('In reuse');$('#gc-no').onclick=()=>act('Not reusable');
}

  $('#gu-body').innerHTML=`<div class="muted" style="margin:8px 0">${kgs(ka.uniqueKg||0)} kg of reuse greige matches the pending knitting below (each kg counted once). Jobs still waiting for knitting where reuse greige of the same fabric, GSM (±5%) and dia is already in the store. Knitting / Planning should use this stock before knitting new fabric.</div>
   <div class="tw"><table><thead><tr><th class="fz">Job needing greige</th><th>Colour</th><th>Fabric</th><th>GSM</th><th>Dia</th><th class="n">Knit balance</th><th class="n">Reuse match kg</th><th>Best match</th><th></th></tr></thead><tbody>${ka.slice(0,300).map((o,k)=>`<tr><td class="fz">${esc(o.r.b+' '+o.r.j)}</td><td>${esc(o.r.c)}</td><td>${esc(o.r.ft)}</td><td>${esc(o.r.gsm)}</td><td>${esc(o.r.dia)}</td><td class="n">${kgs(o.b)}</td><td class="n"><b>${kgs(o.cover)}</b></td><td style="white-space:normal;min-width:240px">${esc(o.ms[0].x.j)} · ${esc(o.ms[0].x.gsm)} · ${esc(o.ms[0].x.dia)} · ${kgs(o.ms[0].x.avail)} kg ${o.ms.length>1?`<span class="muted">+${o.ms.length-1} more</span>`:''}${ka.shared[o.ms[0].x.rid].n>1?`<div class="muted" style="font-size:11px">same stock also matches ${ka.shared[o.ms[0].x.rid].n-1} other job(s)</div>`:''}${o.ms[0].m.warn.length?`<div class="muted" style="font-size:11px">${esc(o.ms[0].m.warn.join(' · '))}</div>`:''}</td><td><button class="btn sm" data-k="${k}">Flag to Knitting / Planning</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No pending knitting matches the reuse stock</td></tr>'}</tbody></table></div>`;
  $('#gu-body').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const o=ka[+b.dataset.k];addFlag(o.r.b+' '+o.r.j,{ft:o.r.ft,gsm:o.r.gsm,dia:o.r.dia,c:o.r.c},o.b,o.ms.map(m=>({rid:m.x.rid,kg:m.x.avail,label:m.x.j+' · '+m.x.ft+' '+m.x.gsm+' '+m.x.dia})));});
}
function addFlag(job,need,qty,matches){S.fseq++;S.flags.push({id:'f'+S.fseq,job,need,qty,matches,st:'Hold for physical check',d:TODAY,by:role()});save();toast('Sent to Planning: hold this job’s fabric approval until the stock is checked');refreshAll()}
function guFind(items){
  const fts=uniq([...G.map(r=>r.ft),...items.map(x=>x.ft)]);
  $('#gu-body').innerHTML=`<div class="split"><div class="panel"><h3>New requirement (fabric order sheet line)</h3><div class="form">
   <div class="row"><span>Job</span><input id="fm-j" placeholder="New job no"></div><div class="row"><span>Fabric type</span><input id="fm-ft" list="fm-ftl"><datalist id="fm-ftl">${fts.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
   <div class="row"><span>GSM</span><input type="number" id="fm-g"></div><div class="row"><span>Dia</span><input id="fm-d" placeholder='72"'></div><div class="row"><span>Colour</span><input id="fm-c" placeholder="needed only for yarn-dyed / melange"></div><div class="row"><span>Greige kg needed</span><input type="number" id="fm-q"></div>
   <div><button class="btn pri" id="fm-go">Find reuse stock</button></div><div class="muted" style="font-size:12px">Must match: fabric type, GSM ±5%, dia ±2". Composition / yarn and shade are checked physically before use.</div></div></div>
   <div class="panel"><h3>Matches</h3><div id="fm-res"><div class="empty">Enter a requirement</div></div></div></div>`;
  $('#fm-go').onclick=()=>{const need={ft:$('#fm-ft').value,gsm:$('#fm-g').value,dia:$('#fm-d').value,c:$('#fm-c').value};const qty=+$('#fm-q').value||0;
    const ms=items.filter(x=>x.avail>=5).map(x=>({x,m:matchScore(need,x,{finished:false})})).filter(o=>o.m.ok).sort((a,b)=>b.m.score-a.m.score||b.x.avail-a.x.avail);
    const tot=ms.reduce((a,o)=>a+o.x.avail,0);
    $('#fm-res').innerHTML=ms.length?`<div style="padding:8px 10px">${pill(kgs(tot)+' kg matching'+(qty?` · covers ${Math.min(100,Math.round(tot/qty*100))}% of ${kgs(qty)} kg`:''),'good')} <button class="btn sm" id="fm-flag">Hold order sheet for check</button></div><table><thead><tr><th>Score</th><th>Fabric</th><th>GSM</th><th>Dia</th><th>From job</th><th class="n">kg</th><th>Why / check</th></tr></thead><tbody>${ms.slice(0,40).map(o=>`<tr><td>${o.m.score}</td><td>${esc(o.x.ft)}</td><td>${esc(o.x.gsm)}</td><td>${esc(o.x.dia)}</td><td>${esc(o.x.j)}</td><td class="n"><b>${kgs(o.x.avail)}</b></td><td style="white-space:normal;min-width:220px">${esc(o.m.why.join(' · '))}${o.m.warn.length?`<div class="muted" style="font-size:11px">${esc(o.m.warn.join(' · '))}</div>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No reuse greige matches — new knitting is needed</div>';
    const fl=$('#fm-flag');if(fl)fl.onclick=()=>addFlag($('#fm-j').value||'New job',need,qty,ms.map(o=>({rid:o.x.rid,kg:o.x.avail,label:o.x.j+' · '+o.x.ft+' '+o.x.gsm+' '+o.x.dia})))};
}
function guFlags(){
  const L=S.flags.slice().reverse();
  $('#gu-body').innerHTML=L.length?`<div class="toolbar"><input id="gf-note" placeholder="Reason when not suitable (shade, handfeel, GSM…)" style="border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--paper);min-width:320px"></div><div class="tw"><table><thead><tr><th>Job</th><th>Need</th><th class="n">kg</th><th>Matching stock</th><th>Status</th><th>Decision</th></tr></thead><tbody>${L.map(f=>`<tr><td><b>${esc(f.job)}</b><div class="muted" style="font-size:11px">${fd(f.d)} · ${esc(f.by)}</div></td><td>${esc([f.need.ft,f.need.gsm,f.need.dia].filter(Boolean).join(' · '))}</td><td class="n">${kgs(f.qty)}</td><td style="white-space:normal;min-width:240px">${f.matches.slice(0,4).map(m=>esc(m.label)+' · '+kgs(m.kg)+' kg').join('<br>')}${f.matches.length>4?`<br><span class="muted">+${f.matches.length-4} more</span>`:''}</td><td>${pill(f.st,f.st==='Use stock'?'good':f.st==='Not suitable'?'':'warn')}${f.note?`<div class="muted" style="font-size:11px">${esc(f.note)}</div>`:''}</td><td>${f.st==='Hold for physical check'?`<button class="btn sm pri" data-use="${f.id}">Use stock</button> <button class="btn sm" data-no="${f.id}">Not suitable</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No order sheet checks yet. Use "Flag" on a knitting alert or "Hold order sheet for check" in Find a match.</div>';
  const can=()=>['Planning & Control','Knitting'].includes(role());
  $('#gu-body').querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{if(!can())return toast('Planning & Control (or Knitting) decides');const f=S.flags.find(x=>x.id===b.dataset.use);let left=f.qty||f.matches.reduce((a,m)=>a+m.kg,0);
    for(const m of f.matches){if(left<=0)break;const it=reuseItems().find(x=>x.rid===m.rid);if(!it||it.avail<=0)continue;const t=Math.min(left,it.avail);S.resv.push({rid:m.rid,kg:t,job:f.job,d:TODAY,by:role()});left-=t}
    f.st='Use stock';f.note=`${kgs((f.qty||0)-Math.max(0,left))} kg reserved from reuse stock · knit only the rest`;save();toast('Reuse stock reserved for '+f.job);refreshAll()});
  $('#gu-body').querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{if(!can())return toast('Planning & Control (or Knitting) decides');const f=S.flags.find(x=>x.id===b.dataset.no);const n=$('#gf-note').value.trim();if(!n)return toast('Write the reason in the box above');f.st='Not suitable';f.note=n;save();refreshAll()});
}

/* ---------- demo data (labelled, removable with "Clear demo") ---------- */
function seedDemo(){
  if(S.demoSeeded||!BOOT.user.uiRoles.includes('Greige Store'))return;S.demoSeeded=true;const pick=(f,n)=>G.filter(f).slice(0,n);
  const kb=pick(r=>gKnitBal(r)>80&&r.gq>0,8);
  kb.slice(0,6).forEach((r,k)=>{const own=k<3;S.kseq++;const kgv=Math.round(Math.min(gKnitBal(r),own?420:260));
    const d={id:'k'+S.kseq,i:r.i,ch:'DEMO-K'+(2700+k),src:own?'NFL':(r.kc&&r.kc!=='NFL'?r.kc:'Khadiza'),kg:kgv,rolls:Math.max(1,Math.round(kgv/22)),d:TODAY,by:'Knitting',st:'Pending',demo:true};
    if(k===5){d.acc={kg:kgv-3,rolls:d.rolls,loc:LOCS[0],rack:'A-4',n:'',d:TODAY,by:'Greige Store'};d.st='QC pending'}S.kdel.push(d)});
  const ih=pick(r=>!r.sdf&&gAvail(r)>=250,2),sc=pick(r=>r.sdf&&gAvail(r)>=150,2);
  ih.forEach((r,k)=>{S.rseq++;S.req.push({id:'q'+S.rseq,no:'GR-'+String(S.rseq).padStart(4,'0'),type:'In-house batch',ref:'DEMO-BC-'+(261029+k),i:r.i,kg:Math.round(Math.min(gAvail(r),600)),fac:'NFL',d:TODAY,by:'Dyeing Planner',st:'Open',demo:true})});
  sc.forEach((r,k)=>{S.rseq++;const q={id:'q'+S.rseq,no:'GR-'+String(S.rseq).padStart(4,'0'),type:'Subcontract WO',ref:'DEMO-DWO-'+(12+k),i:r.i,kg:Math.round(gAvail(r)+(k?200:0)),fac:r.sdf,d:TODAY,by:'Dyeing Planner',st:'Open',demo:true};S.req.push(q);
    if(k===0){S.gseq++;S.giss.push({no:'GD-'+String(S.gseq).padStart(4,'0'),req:q.id,i:r.i,ref:q.ref,kg:Math.round(gAvail(r)/2),loc:LOCS[0],rolls:6,d:TODAY,by:'Greige Store',demo:true})}});
  SYNC.demo();
}
function clearDemo(){S.kdel=S.kdel.filter(x=>!x.demo);S.req=S.req.filter(x=>!x.demo);S.giss=S.giss.filter(x=>!x.demo);save();toast('Demo data removed');refreshAll();demoBadge()}
function demoBadge(){const n=S.kdel.filter(x=>x.demo).length+S.req.filter(x=>x.demo).length;let b=$('#demob');if(!b){b=document.createElement('button');b.id='demob';b.className='demob';$('.top .sp').after(b);b.onclick=clearDemo}b.style.display=n?'':'none';b.textContent=`Demo data (${n}) · Clear`}
seedDemo();demoBadge();
bootApp({gs:renderGS,gr:renderGR,gq:renderGQ,gu:renderGU},'gs',()=>{$('#c-gr').textContent=S.kdel.filter(d=>d.st==='Pending'||d.st==='QC pending').length;$('#c-gq').textContent=S.req.filter(q=>q.st==='Open').length;$('#c-gu').textContent=toCheck().length});

}
</script><script>
const NOS={desk:'greige',
  token:()=>{try{let t=localStorage.getItem('nfl_access_token');if(!t||t==='undefined'||t==='null'){t='demo-access-token';localStorage.setItem('nfl_access_token',t)}return t}catch(e){return'demo-access-token'}},
  async api(path,init={}){const headers={'Content-Type':'application/json'};const t=NOS.token();if(t)headers.Authorization='Bearer '+t;
    const res=await fetch('/api'+path,{...init,headers,cache:'no-store'});
    const data=await res.json().catch(()=>({}));if(!res.ok){const m=data.message;throw new Error(typeof m==='string'?m:(m&&m.message)||('Request failed: '+res.status))}return data},
  mark(t){const el=document.getElementById('savestate');if(!el)return;el.textContent=t;clearTimeout(NOS._m);NOS._m=setTimeout(()=>{el.textContent=''},2500)}};
(async()=>{const box=document.getElementById('boot');NOS.token();
  try{const boot=await NOS.api('/stores/greige/bootstrap');box.remove();document.querySelector('main').style.display='';APP(boot)}catch(e){box.textContent=e.message||'Could not load the store'}})();
</script><script src="/erp-sidebar.js"></script></body></html>
