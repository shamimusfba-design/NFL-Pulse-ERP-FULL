<div class="themebtn" role="group" aria-label="Day or Night"><span data-th="light" role="button" tabindex="0">☀ Day</span><span data-th="dark" role="button" tabindex="0">☾ Night</span></div></header>
<nav class="mainnav" id="mainnav" aria-label="Sections"></nav>

<div id="printArea"></div>
<script>
__YARNDATA__
__YARNJS__
(function(){
'use strict';
function setTheme(t){document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===t))}
setTheme('light');document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));
const api=mountYarn(document.getElementById('app-yarn'),'2026-10-09');
function nav(){document.getElementById('mainnav').innerHTML=api.top.map(([k,l])=>`<button class="${api.top_===k?'on':''}" data-k="${k}">${l}</button>`).join('');document.querySelectorAll('#mainnav [data-k]').forEach(b=>b.onclick=()=>{api.setTop(b.dataset.k);nav();window.scrollTo(0,0)})}
window.__yarnNav=nav;nav();
})();
</script>
