<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOS · Sample Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--indigo:#1f3a5f;--indigo-2:#2c5282;--chalk:#f4f6f9;--paper:#fff;--ink:#18202b;--ink-2:#5a667c;--line:#e1e5ec;--thread:#c9a227;
--good:#2e7d4f;--warn:#a86a12;--bad:#c0392b;--info:#2c5282;--good-bg:#e6f4ec;--warn-bg:#fcf1d9;--bad-bg:#fbe8e5;--info-bg:#e7eef8;--chip:#edf0f5;--sel:#eef3fb;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--indigo:#8fb3e6;--indigo-2:#9dbbe8;--chalk:#0f141b;--paper:#171f2a;--ink:#e8edf4;--ink-2:#9ba8bc;--line:#283241;--thread:#d9b64a;--good:#5cc08a;--warn:#e2b04f;--bad:#ef7a6c;--info:#8fb3e6;--good-bg:#15332a;--warn-bg:#382d13;--bad-bg:#3b1c19;--info-bg:#1a2a40;--chip:#212b38;--sel:#1c2a3d;color-scheme:dark}}
:root[data-theme="dark"]{--indigo:#8fb3e6;--indigo-2:#9dbbe8;--chalk:#0f141b;--paper:#171f2a;--ink:#e8edf4;--ink-2:#9ba8bc;--line:#283241;--thread:#d9b64a;--good:#5cc08a;--warn:#e2b04f;--bad:#ef7a6c;--info:#8fb3e6;--good-bg:#15332a;--warn-bg:#382d13;--bad-bg:#3b1c19;--info-bg:#1a2a40;--chip:#212b38;--sel:#1c2a3d;color-scheme:dark}
html,body{height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--chalk);color:var(--ink);font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--indigo);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--indigo)}
:root[data-theme="dark"] header.top,:root[data-theme="dark"] body::before{background:#0b1016}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top,:root:not([data-theme="light"]) body::before{background:#0b1016}}
.logo{font-weight:700;font-size:18px;white-space:nowrap}.logo small{font-weight:400;opacity:.75;margin-left:8px;font-size:13px}
.asof{font-size:13px;opacity:.8}
.top .sp{flex:1}
.topbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500}
.topbtn.solid{background:var(--thread);border-color:var(--thread);color:#1b1404}
nav.tabs{background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 14px;overflow-x:auto;position:sticky;top:52px;z-index:19}
nav.tabs button{border:0;background:none;padding:11px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.active{color:var(--ink);border-bottom-color:var(--thread)}
nav.tabs button .ct{font-size:12px;background:var(--chip);border-radius:999px;padding:0 7px;margin-left:5px;color:var(--ink-2)}
main{padding:16px 20px 60px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--indigo-2)}.kpi.on{outline:2px solid var(--thread)}
.kpi .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{color:var(--ink-2);font-size:12.5px}
.kpi.bad .n{color:var(--bad)}.kpi.warn .n{color:var(--warn)}.kpi.good .n{color:var(--good)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:5px 9px;min-height:34px;max-width:100%}
.fbar select{max-width:170px}
.fbar input[type=search]{min-width:220px;flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 12px;cursor:pointer;font-weight:500;min-height:34px}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1016}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1016}}
.btn.sm{min-height:28px;padding:2px 9px;font-size:13px}
.btn:focus-visible,select:focus-visible,input:focus-visible,nav.tabs button:focus-visible,.kpi:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
.achips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}
.achip{background:var(--info-bg);color:var(--info);border-radius:999px;padding:1px 10px;font-size:12.5px;border:0;cursor:pointer}
.split{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.split.withpanel{grid-template-columns:minmax(0,1fr) 400px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.panel.pad{padding:14px}
.tablewrap{overflow:auto;max-height:calc(100vh - 330px);min-height:300px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--ink-2);background:var(--chalk);position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
th.grp{cursor:default;text-align:center;font-size:12px;top:0}
th .ar{font-size:10px;margin-left:3px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--chip)}tbody tr.sel{background:var(--sel)}
tbody tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--chip);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.muted{color:var(--ink-2)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap;gap:8px}
.side{position:sticky;top:110px;max-height:calc(100vh - 124px);overflow:auto}
.side header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.side h3{margin:0;font-size:17px}
.side .body{padding:12px 14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin-bottom:10px}
.kv span{display:block;color:var(--ink-2);font-size:11.5px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2)}
.form label > *{color:var(--ink)}
.form .full{grid-column:1/-1}
.ms{display:flex;flex-wrap:wrap;gap:6px}
.ms label{flex-direction:row;align-items:center;gap:5px;background:var(--chip);padding:3px 9px;border-radius:999px;font-size:12.5px;color:var(--ink);cursor:pointer}
.ms input{margin:0}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
h4{margin:14px 0 6px;font-size:13.5px}
.tl{border-left:2px solid var(--line);margin-left:5px;padding-left:12px;font-size:12.5px}
.tl div{position:relative;margin-bottom:6px}.tl div::before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--thread)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ptitle{font-size:15px;font-weight:600;margin:0 0 2px}.phint{font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.bars .b{display:grid;grid-template-columns:140px 1fr 64px;gap:8px;align-items:center;margin:5px 0;font-size:13px;cursor:pointer}
.bars .tr{height:12px;background:var(--chip);border-radius:6px;overflow:hidden;display:flex}.bars .sg{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.catcard{padding:14px}.catcard .big{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}.catcard .big div{min-width:90px}.catcard .big b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;z-index:60;display:none;font-size:14px}
.toast.show{display:block}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.overlay{display:none}
@media (max-width:1200px){:root:not(.desk) .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}:root:not(.desk) .split.withpanel{grid-template-columns:minmax(0,1fr) 360px}}
:root.desk body{min-width:1320px}
.topbtn.on{background:#fff;color:var(--indigo);border-color:#fff}
@media (max-width:900px){
 :root:not(.desk) .split.withpanel{grid-template-columns:1fr}
 :root:not(.desk) .side{position:fixed;inset:0;top:auto;max-height:88vh;z-index:40;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
 :root:not(.desk) .overlay.open{display:block;position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:39}
 :root:not(.desk) .grid2,:root:not(.desk) .grid3{grid-template-columns:1fr}
 :root:not(.desk) nav.tabs{top:0;position:relative}
 :root:not(.desk) header.top{position:relative}
 :root:not(.desk) .tablewrap{max-height:none}
}
@media (max-width:600px){:root:not(.desk) main{padding:12px 10px 40px}:root:not(.desk) .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}:root:not(.desk) .fbar select{max-width:none;flex:1 1 45%}:root:not(.desk) .bars .b{grid-template-columns:100px 1fr 54px}:root:not(.desk) .form{grid-template-columns:1fr}:root:not(.desk) .asof{display:none}}

.desk-note{}
.typebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left;min-width:120px}
.tbtn b{display:block;font-size:15px}.tbtn span{font-size:12px;color:var(--ink-2)}
.tbtn.on{background:var(--indigo);border-color:var(--indigo);color:#fff}.tbtn.on span{color:#dbe5f3}
:root[data-theme="dark"] .tbtn.on{color:#0b1016}:root[data-theme="dark"] .tbtn.on span{color:#0b1016}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tbtn.on,:root:not([data-theme="light"]) .tbtn.on span{color:#0b1016}}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
.layout.nopanel{grid-template-columns:minmax(0,1fr)}
.btab{width:100%;font-size:13px}
.btab td,.btab th{padding:6px 8px}
.btab tr{cursor:pointer}
.stack{height:12px;display:flex;border-radius:6px;overflow:hidden;background:var(--chip);min-width:120px}
.colorrows td{padding:4px}
.colorrows input{width:100%;min-width:70px;min-height:30px;padding:3px 6px}
.secttl{font-size:13px;font-weight:600;margin:12px 0 6px;color:var(--ink)}
.kpis{grid-template-columns:repeat(7,minmax(0,1fr))}
@media (max-width:1300px){:root:not(.desk) .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1000px){:root:not(.desk) .layout{grid-template-columns:1fr}:root:not(.desk) .layout .side{position:fixed;inset:0;top:auto;max-height:88vh;z-index:40;border-radius:14px 14px 0 0}:root:not(.desk) .overlay.open{display:block;position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:39}}
.fab{display:none}
@media (max-width:1000px){:root:not(.desk) .fab{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:999px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.2)}}

.typebar{gap:6px}
.tbtn{min-width:0;padding:6px 12px;border-radius:999px;display:flex;gap:6px;align-items:baseline}
.tbtn b{display:inline;font-size:14px}.tbtn span{font-size:12px}
.kpis{gap:8px;margin-bottom:10px}.kpi{padding:7px 12px}.kpi .n{font-size:19px}
.minis{display:grid;grid-template-columns:1fr 1.25fr 1.4fr 1fr;gap:10px;margin-bottom:10px}
.mini{padding:10px 12px;height:222px;display:flex;flex-direction:column}
.mini .ptitle{font-size:14px}.mini .phint{margin-bottom:6px;font-size:12px}
.mini .scrollbox{overflow:auto;flex:1;min-height:0}
.donutwrap{display:flex;gap:12px;align-items:center;flex:1;min-height:0}
.donut{width:118px;height:118px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--paper)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:12px;color:var(--ink-2)}
.donut .mid b{font-size:18px;color:var(--ink)}
.dleg{font-size:12.5px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:auto;max-height:100%}
.dleg button{border:0;background:none;text-align:left;cursor:pointer;padding:1px 4px;border-radius:5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.dleg button:hover,.dleg button.on{background:var(--chip)}
.dleg i{width:10px;height:10px;border-radius:2px;flex:none}
.qrow{display:grid;grid-template-columns:minmax(0,1.5fr) 1fr 74px;gap:8px;align-items:center;font-size:12.5px;padding:3px 4px;border-radius:6px;cursor:pointer}
.qrow:hover,.qrow.on{background:var(--chip)}
.qrow .tr{height:10px;background:var(--chip);border-radius:5px;overflow:hidden;position:relative}
.qrow .tr div{height:100%}
.qrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.stchips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.stchips button.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.layout{grid-template-columns:minmax(0,1fr) 420px}
.entry{position:sticky;top:62px;height:calc(100vh - 76px);display:flex;flex-direction:column;max-height:none}
.entry .body{flex:1;overflow:auto}
.entry .foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;background:var(--paper);border-radius:0 0 10px 10px}
.newbtn{background:var(--thread);border:0;color:#1b1404;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer}
.fabnote{font-size:12.5px;background:var(--chip);border-radius:8px;padding:8px 10px;color:var(--ink-2)}
.demotag{font-size:11px;color:var(--ink-2);font-weight:400}
@media (max-width:1400px){:root:not(.desk) .minis{grid-template-columns:1fr 1fr}}
@media (max-width:1000px){:root:not(.desk) .entry{position:fixed;inset:auto 0 0 0;top:auto;height:90vh;z-index:40;border-radius:14px 14px 0 0;display:none}:root:not(.desk) .entry.open{display:flex}}
@media (max-width:600px){:root:not(.desk) .minis{grid-template-columns:1fr}}

.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 16px;max-height:190px;overflow:auto}
.wideform{grid-template-columns:repeat(4,minmax(0,1fr))!important}
nav.tabs{top:52px}
.layout .entry{top:110px;height:calc(100vh - 124px)}
@media (max-width:1100px){:root:not(.desk) .qgrid{grid-template-columns:1fr 1fr}:root:not(.desk) .wideform{grid-template-columns:1fr 1fr!important}}
@media (max-width:600px){:root:not(.desk) .qgrid,:root:not(.desk) .wideform{grid-template-columns:1fr!important}}
</style>
</head>
