services:
  postgres:
    image: postgres:17-alpine
    container_name: nfl-pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nfl_pulse}
      POSTGRES_USER: ${POSTGRES_USER:-nfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nfl_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - nfl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nfl} -d ${POSTGRES_DB:-nfl_pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: nfl-pulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nfl_redis_data:/data

volumes:
  nfl_postgres_data:
  nfl_redis_data:
